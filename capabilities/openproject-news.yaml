naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — News
  description: 'OpenProject API V3 (Stable) — News. 5 operations. Lead operation: List News. Self-contained Naftiko capability
    covering one Openproject business surface.'
  tags:
  - Openproject
  - News
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-news
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — News business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-news
      path: /api/v3/news
      operations:
      - name: listnews
        method: GET
        description: List News
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Page number inside the requested collection.
        - name: pageSize
          in: query
          type: integer
          description: Number of elements to display per page.
        - name: sortBy
          in: query
          type: string
          description: JSON specifying sort criteria.
        - name: filters
          in: query
          type: string
          description: JSON specifying filter conditions.
      - name: createnews
        method: POST
        description: Create News
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-v3-news-id
      path: /api/v3/news/{id}
      operations:
      - name: viewnews
        method: GET
        description: View news
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: news id
          required: true
      - name: updatenews
        method: PATCH
        description: Update news
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: News id
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletenews
        method: DELETE
        description: Delete news
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: News id
          required: true
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-news-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — News. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/news
      name: api-v3-news
      description: REST surface for api-v3-news.
      operations:
      - method: GET
        name: listnews
        description: List News
        call: openproject-news.listnews
        with:
          offset: rest.offset
          pageSize: rest.pageSize
          sortBy: rest.sortBy
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnews
        description: Create News
        call: openproject-news.createnews
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/news/{id}
      name: api-v3-news-id
      description: REST surface for api-v3-news-id.
      operations:
      - method: GET
        name: viewnews
        description: View news
        call: openproject-news.viewnews
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatenews
        description: Update news
        call: openproject-news.updatenews
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletenews
        description: Delete news
        call: openproject-news.deletenews
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-news-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — News. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-news
      description: List News
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-news.listnews
      with:
        offset: tools.offset
        pageSize: tools.pageSize
        sortBy: tools.sortBy
        filters: tools.filters
      outputParameters:
      - type: object
        mapping: $.
    - name: create-news
      description: Create News
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openproject-news.createnews
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-news
      description: View news
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-news.viewnews
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-news
      description: Update news
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: openproject-news.updatenews
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-news
      description: Delete news
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: openproject-news.deletenews
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
