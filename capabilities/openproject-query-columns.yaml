naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Query Columns
  description: 'OpenProject API V3 (Stable) — Query Columns. 1 operations. Lead operation: View Query Column. Self-contained
    Naftiko capability covering one Openproject business surface.'
  tags:
  - Openproject
  - Query Columns
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-query-columns
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Query Columns business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-queries-columns-id
      path: /api/v3/queries/columns/{id}
      operations:
      - name: viewquerycolumn
        method: GET
        description: View Query Column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: QueryColumn id
          required: true
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-query-columns-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Query Columns. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v3/queries/columns/{id}
      name: api-v3-queries-columns-id
      description: REST surface for api-v3-queries-columns-id.
      operations:
      - method: GET
        name: viewquerycolumn
        description: View Query Column
        call: openproject-query-columns.viewquerycolumn
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-query-columns-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Query Columns. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: view-query-column
      description: View Query Column
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-query-columns.viewquerycolumn
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
