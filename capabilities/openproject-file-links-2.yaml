naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — File links
  description: 'OpenProject API V3 (Stable) — File links. 15 operations. Lead operation: Gets a file link.. Self-contained
    Naftiko capability covering one Openproject business surface.'
  tags:
  - Openproject
  - File links
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
