    - name: api-v3-file_links-id
      path: /api/v3/file_links/{id}
      operations:
      - name: viewfilelink
        method: GET
        description: Gets a file link.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: File link id
          required: true
      - name: deletefilelink
        method: DELETE
        description: Removes a file link.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: File link id
          required: true
    - name: api-v3-file_links-id-download
      path: /api/v3/file_links/{id}/download
      operations:
      - name: downloadfilelink
        method: GET
        description: Creates a download uri of the linked file.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: File link id
          required: true
    - name: api-v3-file_links-id-open
