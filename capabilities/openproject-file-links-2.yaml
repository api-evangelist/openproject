        method: GET
        description: Creates an opening uri of the linked file.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: File link id
          required: true
        - name: location
          in: query
          type: boolean
          description: Boolean flag indicating, if the file should be opened directly or rather the directory location.
    - name: api-v3-storages
      path: /api/v3/storages
      operations:
      - name: liststorages
        method: GET
        description: Get Storages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createstorage
