      name: api-v3-grids
      description: REST surface for api-v3-grids.
      operations:
      - method: GET
        name: listgrids
        description: List grids
        call: openproject-grids.listgrids
        with:
          offset: rest.offset
          pageSize: rest.pageSize
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
