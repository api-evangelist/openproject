    resources:
    - name: api-v3-grids
      path: /api/v3/grids
      operations:
      - name: listgrids
        method: GET
        description: List grids
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: offset
          in: query
          type: integer
          description: Page number inside the requested collection.
        - name: pageSize
          in: query
          type: integer
          description: Number of elements to display per page.
        - name: filters
          in: query
          type: string
          description: JSON specifying filter conditions. Accepts the same format as returned by
      - name: creategrid
        method: POST
        description: Create a grid
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-v3-grids-form
      path: /api/v3/grids/form
      operations:
      - name: gridcreateform
        method: POST
        description: Grid Create Form
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v3-grids-id
