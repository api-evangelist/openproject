naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Schemas
  description: 'OpenProject API V3 (Stable) — Schemas. 1 operations. Lead operation: view the schema. Self-contained Naftiko
    capability covering one Openproject business surface.'
  tags:
  - Openproject
  - Schemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-schemas
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Schemas business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-example-schema
      path: /api/v3/example/schema
      operations:
      - name: viewtheschema
        method: GET
        description: view the schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-schemas-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Schemas. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/example/schema
      name: api-v3-example-schema
      description: REST surface for api-v3-example-schema.
      operations:
      - method: GET
        name: viewtheschema
        description: view the schema
        call: openproject-schemas.viewtheschema
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-schemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Schemas. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: view-schema
      description: view the schema
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-schemas.viewtheschema
      outputParameters:
      - type: object
        mapping: $.
