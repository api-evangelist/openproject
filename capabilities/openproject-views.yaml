naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Views
  description: 'OpenProject API V3 (Stable) — Views. 3 operations. Lead operation: List views. Self-contained Naftiko capability
    covering one Openproject business surface.'
  tags:
  - Openproject
  - Views
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-views
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Views business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-views
      path: /api/v3/views
      operations:
      - name: listviews
        method: GET
        description: List views
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filters
          in: query
          type: string
          description: JSON specifying filter conditions.
    - name: api-v3-views-id
      path: /api/v3/views/{id}
      operations:
      - name: viewview
        method: GET
        description: View view
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: View id
          required: true
      - name: createviews
        method: POST
        description: Create view
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The view identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-views-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Views. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/views
      name: api-v3-views
      description: REST surface for api-v3-views.
      operations:
      - method: GET
        name: listviews
        description: List views
        call: openproject-views.listviews
        with:
          filters: rest.filters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/views/{id}
      name: api-v3-views-id
      description: REST surface for api-v3-views-id.
      operations:
      - method: GET
        name: viewview
        description: View view
        call: openproject-views.viewview
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createviews
        description: Create view
        call: openproject-views.createviews
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-views-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Views. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-views
      description: List views
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-views.listviews
      with:
        filters: tools.filters
      outputParameters:
      - type: object
        mapping: $.
    - name: view-view
      description: View view
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-views.viewview
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-view
      description: Create view
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: openproject-views.createviews
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
