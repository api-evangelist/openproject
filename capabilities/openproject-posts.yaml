naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Posts
  description: 'OpenProject API V3 (Stable) — Posts. 1 operations. Lead operation: View Post. Self-contained Naftiko capability
    covering one Openproject business surface.'
  tags:
  - Openproject
  - Posts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-posts
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Posts business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-posts-id
      path: /api/v3/posts/{id}
      operations:
      - name: viewpost
        method: GET
        description: View Post
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Post's identifier
          required: true
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-posts-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Posts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/posts/{id}
      name: api-v3-posts-id
      description: REST surface for api-v3-posts-id.
      operations:
      - method: GET
        name: viewpost
        description: View Post
        call: openproject-posts.viewpost
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-posts-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Posts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: view-post
      description: View Post
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-posts.viewpost
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
