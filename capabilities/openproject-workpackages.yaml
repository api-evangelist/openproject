naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — WorkPackages
  description: 'OpenProject API V3 (Stable) — WorkPackages. 1 operations. Lead operation: List emoji reactions by work package
    activities. Self-contained Naftiko capability covering one Openproject business surface.'
  tags:
  - Openproject
  - WorkPackages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-workpackages
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — WorkPackages business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-work_packages-id-activities_emoji_reactions
      path: /api/v3/work_packages/{id}/activities_emoji_reactions
      operations:
      - name: listworkpackageactivitiesemojireactions
        method: GET
        description: List emoji reactions by work package activities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: ID of the work package whose activities' emoji reactions will be listed
          required: true
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-workpackages-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — WorkPackages. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v3/work-packages/{id}/activities-emoji-reactions
      name: api-v3-work-packages-id-activities-emoji-reactions
      description: REST surface for api-v3-work_packages-id-activities_emoji_reactions.
      operations:
      - method: GET
        name: listworkpackageactivitiesemojireactions
        description: List emoji reactions by work package activities
        call: openproject-workpackages.listworkpackageactivitiesemojireactions
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-workpackages-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — WorkPackages. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-emoji-reactions-work-package
      description: List emoji reactions by work package activities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-workpackages.listworkpackageactivitiesemojireactions
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
