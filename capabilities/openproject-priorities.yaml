naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Priorities
  description: 'OpenProject API V3 (Stable) — Priorities. 2 operations. Lead operation: List all Priorities. Self-contained
    Naftiko capability covering one Openproject business surface.'
  tags:
  - Openproject
  - Priorities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-priorities
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Priorities business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-priorities
      path: /api/v3/priorities
      operations:
      - name: listallpriorities
        method: GET
        description: List all Priorities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v3-priorities-id
      path: /api/v3/priorities/{id}
      operations:
      - name: viewpriority
        method: GET
        description: View Priority
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Priority id
          required: true
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-priorities-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Priorities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/priorities
      name: api-v3-priorities
      description: REST surface for api-v3-priorities.
      operations:
      - method: GET
        name: listallpriorities
        description: List all Priorities
        call: openproject-priorities.listallpriorities
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/priorities/{id}
      name: api-v3-priorities-id
      description: REST surface for api-v3-priorities-id.
      operations:
      - method: GET
        name: viewpriority
        description: View Priority
        call: openproject-priorities.viewpriority
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-priorities-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Priorities. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-all-priorities
      description: List all Priorities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-priorities.listallpriorities
      outputParameters:
      - type: object
        mapping: $.
    - name: view-priority
      description: View Priority
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-priorities.viewpriority
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
