naftiko: 1.0.0-alpha2
info:
  label: OpenProject API V3 (Stable) — Root
  description: 'OpenProject API V3 (Stable) — Root. 1 operations. Lead operation: View root. Self-contained Naftiko capability
    covering one Openproject business surface.'
  tags:
  - Openproject
  - Root
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OPENPROJECT_API_KEY: OPENPROJECT_API_KEY
capability:
  consumes:
  - type: http
    namespace: openproject-root
    baseUri: https://qa.openproject-edge.com
    description: OpenProject API V3 (Stable) — Root business capability. Self-contained, no shared references.
    resources:
    - name: api-v3
      path: /api/v3
      operations:
      - name: viewroot
        method: GET
        description: View root
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.OPENPROJECT_USER}}'
      password: '{{env.OPENPROJECT_PASS}}'
  exposes:
  - type: rest
    namespace: openproject-root-rest
    port: 8080
    description: REST adapter for OpenProject API V3 (Stable) — Root. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3
      name: api-v3
      description: REST surface for api-v3.
      operations:
      - method: GET
        name: viewroot
        description: View root
        call: openproject-root.viewroot
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openproject-root-mcp
    port: 9090
    transport: http
    description: MCP adapter for OpenProject API V3 (Stable) — Root. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: view-root
      description: View root
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openproject-root.viewroot
      outputParameters:
      - type: object
        mapping: $.
