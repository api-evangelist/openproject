    ProjectPhase           | not null    | READ                 |                                                                                           |

    | definition   | This definition this phase relies on                                                         |
    ProjectPhaseDefinition | not null    | READ                 |                                                                                           |

    | project      | This project this phase is instantiated in                                                   |
    Project                | not null    | READ                 |                                                                                           |


    ## Local Properties


