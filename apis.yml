  description: >-
    Work packages may be related to each other in different ways.


    ```

    +--------------+                            +--------------+

    |              | 1                        1 |              |

    | Work package +-------------+--------------+ Work package |

    |              | from        |           to |              |

    +--------------+             |              +--------------+
                          +------+-------+
                          |   Relation   |
                          +--------------+
                          | type         |
                          | reverseType  |
                          | description  |
                          | lag        |
                          +--------------+
    ```


    ## Actions


    | Link                | Description                                                          | Condition                                     |

    |:-------------------:| -------------------------------------------------------------------- | ---------------------------------------------
    |

    | update              | Updates the relation between two work packages via a form            | **Permission**:
    manage work package relations |

    | updateImmediately   | Updates the relation between two work packages                       | **Permission**:
    manage work package relations |

    | delete              | Destroys the relation between the two work packages                  | **Permission**:
    manage work package relations |


