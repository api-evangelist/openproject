- aid: openproject:openproject-workspaces-api
  name: OpenProject Workspaces API
  description: "Workspaces are containers for resources to be worked on and people with sets of permissions\
    \ that work on the former. There is no actual workspace resource\nin OpenProject. Rather, it is the\
    \ generic term describing:\n* [Portfolio](https://www.openproject.org/docs/api/endpoints/portfolios)\n\
    * [Program](https://www.openproject.org/docs/api/endpoints/programs)\n* [Project](https://www.openproject.org/docs/api/endpoints/projects)\n\
    \nA lot of resources reference the workspaces they are valid in, e.g. [Work package](https://www.openproject.org/docs/api/endpoints/work-packages/#linked-properties)\
    \ and\n[Memberships](https://www.openproject.org/docs/api/endpoints/memberships/#linked-properties).\n\
    \nBefore OP 17.0 only projects existed. At that point, the API v3 was already established. That is\
    \ the reason why quite a number of\nresource have links called \"project\" or similar when they are\
    \ in fact contained in a different type of workspace. To not break the API, the name of the link was\
    \ kept. \nBut those links can contain the other types of workspaces as well. It can thus be possible\
    \ for a work package to have the following:\n\n```\n  {\n     \"_links\": {\n       \"project\": {\n\
    \         \"href\": \"/api/v3/portfolios/48\",\n         \"title: \"A portfolio\"\n       },\n   \
    \    ...\n     },\n     ...\n  }\n```\n\nAccordingly, to set the workspace a resource is in, sending\
    \ any workspace link to the link property will be accepted by the API.\n\nThe concept of workspaces\
    \ is planned to be extended to include further types."
