    |

    | :------: | --------------------------------------- | ------ | ----------- | --------------------
    |

    | date     | The date in ISO8601 format (YYYY-MM-DD) | Date   | not null    | READ                 |

    | name     | The name of the non-working day day     | String | not null    | READ/WRITE           |
