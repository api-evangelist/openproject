- aid: openproject:openproject-portfolios-api
  name: OpenProject Portfolios API
  description: "Portfolios are one of the types of [workspaces](https://www.openproject.org/docs/api/endpoints/workspaces)\
    \ in OpenProject structuring the information (e.g. work packages, wikis) into smaller sets. They are\
    \ typically used to group, structure and manage sub-portfolios, programs and projects that\ntarget\
    \ similar strategic goals of the organization. \n\nAs containers, they also control behaviour of the\
    \ elements within them. One of the most important aspects of this is that portfolios limit permissions\
    \ by having members with a certain permission set (roles) assigned to them.\n\n## Actions\n\n| Link\
    \                         | Description                                                          |\
    \ Condition                                                                                      |\n\
    |:--------------------------:  |----------------------------------------------------------------------|\
    \ ---------------------------------                                                              |\n\
    | update                       | Form endpoint that aids in updating this portfolio              \
    \     | **Permission**: edit workspace                                                           \
    \      |\n| updateImmediately            | Directly update this portfolio                        \
    \               | **Permission**: edit workspace                                                 \
    \                |\n| delete                       | Delete this portfolio                       \
    \                         | **Permission**: admin                                                \
    \                          |\n| favor                        | Mark this portfolio as favorited by\
    \ the current user                 | **Permission**: none but login is required, only present if the\
    \ portfolio is not yet favorited |\n| disfavor                     | Mark this portfolio as no longer\
    \ favorited by the current user       | **Permission**: none but login is required, only present if\
    \ the portfolio is favorited         |\n| createWorkPackage            | Form endpoint that aids in\
    \ preparing and creating a work package     | **Permission**: add work packages                  \
    \                                            |\n| createWorkPackageImmediately | Directly creates\
    \ a work package in the portfolio                     | **Permission**: add work packages        \
    \                                                      |\n\n## Linked Properties\n\n| Link       \
    \  | Description                                                                                 \
    \                        | Type            | Constraints | Supported operations |Condition       \
    \                                                                                 |\n| :----------:\
    \ | -------------                                                                                \
    \                       | ----            | ----------- | -------------------- |-----------------------------------------\
    \                                                        |\n| self         | This portfolio      \
    \                                                                                                |\
    \ Portfolio       | not null    | READ                 |                                         \
    \                                                        |\n| ancestors    | Array of all ancestors\
    \ of the portfolio, down from the root node (first element) to the parent (last element).      | Collection\
    \      | not null    | READ                 | **Permission** view portfolio on the ancestor portfolio.\
    \ Non visible portfolios will be omitted |\n| categories   | Categories available in this portfolio\
    \                                                                              | Collection      |\
    \ not null    | READ                 |                                                           \
    \                                      |\n| types        | Types available in this portfolio     \
    \                                                                              | Collection      |\
    \ not null    | READ                 | **Permission**: view work packages or manage types        \
    \                                      |\n| versions     | Versions available in this portfolio  \
    \                                                                              | Collection      |\
    \ not null    | READ                 | **Permission**: view work packages or manage versions     \
    \                                      |\n| memberships  | Memberships in the portfolio          \
    \                                                                              | Collection      |\
    \ not null    | READ                 | **Permission**: view members                              \
    \                                      |\n| workPackages | Work Packages of this portfolio       \
    \                                                                              | Collection      |\
    \ not null    | READ                 |                                                           \
    \                                      |\n| parent       | Parent portfolio of the portfolio     \
    \                                                                              | Portfolio       |\
    \             | READ/WRITE           | **Permission** edit workspace                             \
    \                                      |\n| status       | Denotes the status of the portfolio, so\
    \ whether the portfolio is on track, at risk or is having trouble.            | PortfolioStatus |\
    \             | READ/WRITE           | **Permission** edit workspace                             \
    \                                      |\n\nDepending on custom fields defined for portfolios, additional\
    \ links might exist.\n\nNote, that the parent and ancestor links may contain the \"undisclosed uri\"\
    \ `urn:openportfolio-org:api:v3:undisclosed` in case an\nancestor portfolio is defined but the client\
    \ lacks permission to see it. See the\n[general introduction into links' properties](https://www.openportfolio.org/docs/api/basic-objects/#local-properties)\
