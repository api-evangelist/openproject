openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Time Entries API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- name: Time Entries
paths:
  /api/v3/time_entries/{id}/form:
    post:
      parameters:
      - description: Time entries activity id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions to edit the time entry.


            **Required permission:** *edit time entries* for every time entry of a project, or *edit own time entries* for time entries belonging to the user.'
          headers: {}
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: 'Returned if the time entry does not exist or if the client does not have sufficient permissions to view it.


            **Required permission** `view time entries` in the project the time entry is assigned to or `view own time entries` for time entries belonging to the user'
          headers: {}
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      tags:
      - Time Entries
      description: ''
      operationId: Time_entry_update_form
      requestBody:
        content:
          application/json:
            schema:
              type: integer
        description: Time entries activity id
        required: true
      summary: Time entry update form
  /api/v3/time_entries/available_projects:
    get:
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _embedded:
                      elements:
                      - _type: Project...
                      - _type: Project...
                    _links:
                      self:
                        href: /api/v3/time_entries/available_projects
                    _type: Collection
                    count: 2
                    total: 2
              schema:
                $ref: '#/components/schemas/Available_projects_for_time_entriesModel'
          description: OK
          headers: {}
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** *log time*, *edit time entries* or *edit own time entries* in any project'
          headers: {}
      tags:
      - Time Entries
      description: Gets a list of projects in which a time entry can be created in or be assigned to on update. The list contains all projects in which the user issuing the request has the necessary permissions.
      operationId: Available_projects_for_time_entries
      summary: Available projects for time entries
  /api/v3/time_entries/form:
    post:
      responses:
        '200':
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** *log time* in any project'
          headers: {}
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      tags:
      - Time Entries
      description: ''
      operationId: Time_entry_create_form
      summary: Time entry create form
  /api/v3/time_entries/schema:
    get:
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _dependencies: []
                    _links:
                      self:
                        href: /api/v3/time_entries/schema
                    _type: Schema
                    activity:
                      _links: {}
                      hasDefault: true
                      location: _links
                      name: Activity
                      required: true
                      type: TimeEntriesActivity
                      writable: true
                    createdAt:
                      hasDefault: false
                      name: Created on
                      options: {}
                      required: true
                      type: DateTime
                      writable: false
                    customField29:
                      hasDefault: false
                      name: sfsdfsdfsdfsdfdsf
                      options:
                        rtl: null
                      required: false
                      type: String
                      writable: true
                    hours:
                      hasDefault: false
                      name: Hours
                      options: {}
                      required: true
                      type: Duration
                      writable: true
                    id:
                      hasDefault: false
                      name: ID
                      options: {}
                      required: true
                      type: Integer
                      writable: false
                    project:
                      _links: {}
                      hasDefault: false
                      location: _links
                      name: Project
                      required: false
                      type: Project
                      writable: true
                    ongoing:
                      hasDefault: false
                      name: Ongoing
                      options: {}
                      required: false
                      type: Boolean
                      writable: true
                    spentOn:
                      hasDefault: false
                      name: Date
                      options: {}
                      required: true
                      type: Date
                      writable: true
                    updatedAt:
                      hasDefault: false
                      name: Updated on
                      options: {}
                      required: true
                      type: DateTime
                      writable: false
                    user:
                      hasDefault: false
                      name: User
                      options: {}
                      required: true
                      type: User
                      writable: false
                    workPackage:
                      _links: {}
                      hasDefault: false
                      location: _links
                      name: Work package
                      required: false
                      type: WorkPackage
                      writable: true
              schema:
                $ref: '#/components/schemas/View_time_entry_schemaModel'
          description: OK
          headers: {}
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions to see the schema.


            **Required permission:** *log time* or *view time entries* or *edit time entries* or *edit own time entries* on any project'
          headers: {}
      tags:
      - Time Entries
      description: ''
      operationId: View_time_entry_schema
      summary: View time entry schema
  /api/v3/time_entries/{id}:
    patch:
      summary: update time entry
      tags:
      - Time Entries
      description: 'Updates the given time entry by applying the attributes provided in

        the body. Please note that while there is a fixed set of attributes, custom fields

        can extend a time entries'' attributes and are accepted by the endpoint.'
      operationId: update_time_entry
      parameters:
      - name: id
        description: Time entry id
        example: 1
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/TimeEntryModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Edit (own) time entries, depending on what time entry is being modified.'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
          headers: {}
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'Returned if:


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _embedded:
                  details:
                    attribute: workPackage
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Work package is invalid.
    delete:
      summary: Delete time entry
      tags:
      - Time Entries
      description: Permanently deletes the specified time entry.
      operationId: delete_time_entry
      parameters:
      - name: id
        description: Time entry id
        example: 1
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Returned if the time entry was deleted successfully.
        '403':
          description: Returned if the client does not have sufficient permissions
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
        '404':
          description: 'Returned if the time entry does not exist or if the user does not have sufficient permissions to see the time entry.


            **Required permission** `view time entries` in the project the time entry is assigned to or `view own time entries` for time entries belonging to the user'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      summary: Get time entry
      tags:
      - Time Entries
      description: Retrieves a single time entry identified by the given id.
      operationId: get_time_entry
      parameters:
      - name: id
        description: time entry id
        example: 1
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/TimeEntryModel'
        '404':
          description: 'Returned if the time entry does not exist or if the user does not have permission to view them.


            **Required permission**

            - `view time entries` in the project the time entry is assigned to or

            - `view own time entries` for time entries belonging to the user'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
  /api/v3/time_entries:
    get:
      summary: List time entries
      operationId: list_time_entries
      tags:
      - Time Entries
      description: 'Lists time entries. The time entries returned depend on the filters

        provided and also on the permission of the requesting user.'
      parameters:
      - name: offset
        description: Page number inside the requested collection.
        example: 25
        in: query
        required: false
        schema:
          default: 1
          type: integer
      - name: pageSize
        description: Number of elements to display per page.
        example: '25'
        in: query
        required: false
        schema:
          type: integer
      - name: sortBy
        description: 'JSON specifying sort criteria.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. Currently supported sorts are:


          + id: Sort by primary key


          + hours: Sort by logged hours


          + spent_on: Sort by spent on date


          + created_at: Sort by time entry creation datetime


          + updated_at: Sort by the time the time entry was updated last'
        example: '[["spent_on", "asc"]]'
        in: query
        required: false
        schema:
          default: '["spent_on", "asc"]'
          type: string
      - name: filters
        description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. Currently supported filters are:


          + entity_type: Filter time entries depending on the entity they are logged on. Can either be `WorkPackage` or `Meeting`.


          + entity_id: Filter time entries for the specified entity IDs.


          + project_id: Filter time entries by project


          + user_id: Filter time entries by users


          + ongoing: Filter to only recevie ongoing timers


          + spent_on: Filter time entries by spent on date


          + created_at: Filter time entries by creation datetime


          + updated_at: Filter time entries by the last time they where updated


          + activity_id: Filter time entries by time entry activity'
        example: '[{ "entity_type": { "operator": "=", "values": ["WorkPackage"] }}, { "entity_id": { "operator": "=", "values": ["1", "2"] } }, { "project": { "operator": "=", "values": ["1"] } }]'
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/TimeEntryCollectionModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          description: Returned if the client is not logged in and login is required.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to view this resource.
    post:
      summary: Create time entry
      tags:
      - Time Entries
      description: 'Creates a new time entry applying the attributes provided in the body.

        Please note that while there is a fixed set of attributes, custom fields can extend

        a time entries'' attributes and are accepted by the endpoint.'
      operationId: create_time_entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryModel'
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/TimeEntryModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Log time'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'Returned if:


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _embedded:
                      details:
                        attribute: workPackage
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: Work package is invalid.
components:
  responses:
    MissingContentType:
      description: Occurs when the client did not send a Content-Type header
      content:
        text/plain:
          schema:
            type: string
          example: Missing content-type header
    UnsupportedMediaType:
      description: Occurs when the client sends an unsupported Content-Type header.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:TypeNotSupported
            message: Expected CONTENT-TYPE to be (expected value) but got (actual value).
    InvalidRequestBody:
      description: Occurs when the client did not send a valid JSON object in the request body.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:InvalidRequestBody
            message: The request body was not a single JSON object.
  schemas:
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type:
          - string
          - 'null'
          description: URL to the referenced resource (might be relative)
        title:
          type: string
          description: Representative label for the resource
        templated:
          type: boolean
          default: false
          description: If true the href contains parts that need to be replaced by the client
        method:
          type: string
          default: GET
          description: The HTTP verb to use when requesting the resource
        payload:
          type: object
          description: The payload to send in the request to achieve the desired result
        identifier:
          type: string
          description: An optional unique identifier to the link object
        type:
          type: string
          description: The MIME-Type of the returned resource.
      example:
        href: /api/v3/work_packages
        method: POST
    Available_projects_for_time_entriesModel:
      type: object
      example:
        _links:
          self:
            href: /api/v3/time_entries/available_projects
        _type: Collection
        total: 2
        count: 2
        _embedded:
          elements:
          - _type: Project...
          - _type: Project...
    Formattable:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - plain
          - markdown
          - custom
          readOnly: true
          description: Indicates the formatting language of the raw text
          example: markdown
        raw:
          type: string
          description: The raw text, as entered by the user
          example: I **am** formatted!
        html:
          type: string
          readOnly: true
          description: The text converted to HTML according to the format
          example: I <strong>am</strong> formatted!
      example:
        format: markdown
        raw: I am formatted!
        html: I am formatted!
    View_time_entry_schemaModel:
      type: object
      example:
        _type: Schema
        _dependencies: []
        id:
          type: Integer
          name: ID
          required: true
          hasDefault: false
          writable: false
          options: {}
        createdAt:
          type: DateTime
          name: Created on
          required: true
          hasDefault: false
          writable: false
          options: {}
        updatedAt:
          type: DateTime
          name: Updated on
          required: true
          hasDefault: false
          writable: false
          options: {}
        spentOn:
          type: Date
          name: Date
          required: true
          hasDefault: false
          writable: true
          options: {}
        hours:
          type: Duration
          name: Hours
          required: true
          hasDefault: false
          writable: true
          options: {}
        user:
          type: User
          name: User
          required: true
          hasDefault: false
          writable: false
          options: {}
        workPackage:
          type: WorkPackage
          name: Work package
          required: false
          hasDefault: false
          writable: true
          location: _links
          _links: {}
        project:
          type: Project
          name: Project
          required: false
          hasDefault: false
          writable: true
          location: _links
          _links: {}
        activity:
          type: TimeEntriesActivity
          name: Activity
          required: true
          hasDefault: true
          writable: true
          location: _links
          _links: {}
        customField29:
          type: String
          name: sfsdfsdfsdfsdfdsf
          required: false
          hasDefault: false
          writable: true
          options:
            rtl: null
        _links:
          self:
            href: /api/v3/time_entries/schema
    CustomFieldProperties:
      type: object
      patternProperties:
        ^customField\d+$:
          type:
          - 'null'
          - number
          - boolean
          - string
          - object
          description: 'A custom field value, that belongs to a custom field of a simple type:


            - Boolean

            - Date

            - Float

            - Integer

            - Link (URL)

            - Text

            - Long text'
    ErrorResponse:
      type: object
      required:
      - _type
      - errorIdentifier
      - message
      properties:
        _embedded:
          type: object
          properties:
            details:
              type: object
              properties:
                attribute:
                  type: string
                  example: project
        _type:
          type: string
          enum:
          - Error
        errorIdentifier:
          type: string
          example: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
        message:
          type: string
          example: Project can't be blank.
    TimeEntryModel:
      allOf:
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        properties:
          id:
            type: integer
            description: The id of the time entry
            minimum: 1
          comment:
            allOf:
            - $ref: '#/components/schemas/Formattable'
            - description: A comment to the time entry
          spentOn:
            type: string
            format: date
            description: The date the expenditure is booked for
          hours:
            type: string
            format: duration
            description: The time quantifying the expenditure
          ongoing:
            type: boolean
            description: Whether the time entry is actively tracking time
          createdAt:
            type: string
            format: date-time
            description: The time the time entry was created
          startTime:
            type:
            - string
            - 'null'
            format: date-time
            description: 'The time the time entry was started, or null if the time entry does not have a start time.


              The time is returned as UTC time, if presented to the user it should be converted to the user''s timezone.


              This field is only available if the global `allow_tracking_start_and_end_times` setting is enabled.'
          endTime:
            type:
            - string
            - 'null'
            format: date-time
            description: 'The time the time entry was ended, or null if the time entry does not have a start time.


              The time is returned as UTC time, if presented to the user it should be converted to the user''s timezone.


              This field is only available if the global `allow_tracking_start_and_end_times` setting is enabled.'
          updatedAt:
            type: string
            format: date-time
            description: The time the time entry was last updated
          _links:
            type: object
            required:
            - self
            - project
            - user
            - activity
            - entity
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This time entry


                    **Resource**: TimeEntry'
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Directly perform edits on this time entry


                    # Conditions


                    **Permission**: ''edit time entries'' or ''edit own time entries'' if the time entry belongs to the user'
              update:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Form endpoint that aids in preparing and performing edits on a TimeEntry


                    # Conditions


                    **Permission**: ''edit time entries'' or ''edit own time entries'' if the time entry belongs to the user'
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Delete this time entry


                    # Conditions


                    **Permission**: ''edit time entries'' or ''edit own time entries'' if the time entry belongs to the user'
              schema:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The time entry schema


                    **Resource**: Schema'
              project:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The project the time entry is bundled in. The project might be different from the work package''s project once the workPackage is moved.


                    **Resource**: Project'
              entity:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The entity the time entry is created on


                    **Resource**: WorkPackage, Meeting'
              user:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The user the time entry tracks expenditures for


                    **Resource**: User'
              activity:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The time entry activity the time entry is categorized as


                    **Resource**: TimeEntriesActivity'
        example:
          _type: TimeEntry
          id: 42
          comment:
            format: plain
            raw: The force shall set me free.
            html: <p>The force shall set me free.</p>
          spentOn: '2023-01-11'
          hours: PT4H
          startTime: '2023-01-11T09:58:00.000Z'
          endTime: '2023-01-11T13:58:00.000Z'
          createdAt: '2023-01-11T13:58:24.927Z'
          updatedAt: '2023-01-11T13:58:24.927Z'
          _links:
            self:
              href: /api/v3/time_entries/42
            updateImmediately:
              href: /api/v3/time_entries/42
              method: patch
            update:
              href: /api/v3/time_entries/42/form
              method: post
            delete:
              href: /api/v3/time_entries/42
              method: delete
            schema:
              href: /api/v3/time_entries/schema
            project:
              href: /api/v3/projects/11
              title: DeathStarV2
            entity:
              href: /api/v3/work_packages/77
              title: Build new hangar
            user:
              href: /api/v3/users/3
