            - href: /api/v3/statuses/1
              title: New
            - href: /api/v3/statuses/2
              title: Closed
          name: Status
          type: Status
          location: _links
          _embedded:
            allowedValues:
            - _links:
                self:
                  href: /api/v3/statuses/1
              _type: Status
              id: 1
