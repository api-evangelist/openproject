openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Relations API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- description: Work packages may be related to each other in different ways.
  name: Relations
paths:
  /api/v3/relations:
    get:
      summary: List Relations
      operationId: list_relations
      tags:
      - Relations
      description: 'Lists all relations according to the given (optional, logically conjunctive) filters and ordered by ID.

        The response only includes relations between work packages which the user is allowed to see.'
      parameters:
      - name: filters
        description: 'JSON specifying filter conditions. Accepts the same format as returned by

          the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. Valid fields to filter by are:


          - id - ID of relation

          - from - ID of work package from which the filtered relations emanates.

          - to - ID of work package to which this related points.

          - involved - ID of either the `from` or the `to` work package.

          - type - The type of relation to filter by, e.g. "follows".'
        example: '[{ "from": { "operator": "=", "values": 42 }" }]'
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: 'JSON specifying sort criteria.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.'
        example: '[["type", "asc"]]'
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RelationCollectionModel'
              examples:
                response:
                  $ref: '#/components/examples/RelationCollectionResponse'
        '400':
          description: Returned if the client provides invalid filter parameters.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:InvalidQuery
                    message:
                    - Filters Type filter has invalid values.
  /api/v3/relations/{id}:
    get:
      summary: Get Relation
      operationId: get_relation
      tags:
      - Relations
      description: Get a single relation specified by its unique identifier.
      parameters:
      - description: Relation id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              examples:
                response:
                  $ref: '#/components/examples/RelationResponse'
              schema:
                $ref: '#/components/schemas/RelationReadModel'
        '404':
          description: 'Returned if the relation does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view work packages for the involved work packages'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified relation does not exist.
    delete:
      summary: Delete Relation
      operationId: delete_relation
      tags:
      - Relations
      description: Deletes the relation.
      parameters:
      - description: The unique identifier of the relation resource
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Returned if the relation was deleted successfully. The response body is empty.
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** manage work package relations'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to delete this relation.
        '404':
          description: 'Returned if the relation does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view work packages'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified relation does not exist.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    patch:
      summary: Update Relation
      operationId: update_relation
      tags:
      - Relations
      description: 'When calling this endpoint the client provides a single object, containing the properties and links that it wants

        to change, in the body. It is only allowed to provide properties or links supporting the **write** operation.


        Note that changing the `type` of a relation invariably also changes the respective `reverseType` as well as the

        "name" of it. The returned Relation object will reflect that change. For instance if you change a Relation''s

        `type` to "follows" then the `reverseType` will be changed to `precedes`.


        It is not allowed to change a relation''s involved work packages.'
      parameters:
      - description: Relation ID
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationWriteModel'
            examples:
              request:
                $ref: '#/components/examples/RelationUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RelationReadModel'
              examples:
                response:
                  $ref: '#/components/examples/RelationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '404':
          description: 'Returned if the relation does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view work packages'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified relation does not exist.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: "Returned if:\n\n- the client tries to modify a read-only property (`PropertyIsReadOnly`)\n- a constraint for a property was violated (`PropertyConstraintViolation`)\n- the client provides a link to an invalid resource (`ResourceTypeMismatch`) or a\n  work package that does not exist or for which the client does not have sufficient permissions\n  to see it (**required permissions**: `view work packages` for the involved work packages)."
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _embedded:
                      details:
                        attribute: lag
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: Lag must be a number greater than or equal to 0
  /api/v3/work_packages/{id}/relations:
    post:
      summary: Create relation
      operationId: create_relation
      tags:
      - Relations
      description: 'Create a work package relation on the given work package. A successful creation will result in a relation between

        two work packages, thus appearing on both involved work package resources.'
      parameters:
      - name: id
        description: Work package id
        example: 1
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationWriteModel'
            examples:
              request:
                $ref: '#/components/examples/RelationCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RelationReadModel'
              examples:
                Simple response:
                  $ref: '#/components/examples/RelationResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** manage work package relations'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to create a relation.
        '409':
          description: 'Returned if there already exists a relation between the given work packages of **any** type

            or if the relation is not allowed.'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:UpdateConflict
                    message: Couldn't update the resource because of conflicting modifications.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'Returned if:


            - the client tries to write a read-only property (`PropertyIsReadOnly`)

            - a constraint for a property was violated (`PropertyConstraintViolation`)

            - the client provides a link to an invalid resource (`ResourceTypeMismatch`)'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _embedded:
                      details:
                        attribute: lag
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: Lag must be a number greater than or equal to 0
components:
  examples:
    RelationCollectionResponse:
      description: Simple response of a relation collection.
      value:
        _type: Collection
        total: 40
        count: 20
        pageSize: 20
        offset: 1
        _embedded:
          elements:
          - _type: Relation
            id: 650
            name: duplicated by
            type: duplicated
            reverseType: duplicates
            lag: null
            description: Those are the same... stupid Stormtroopers!
            _links:
              self:
                href: /api/v3/relations/650
              updateImmediately:
                href: /api/v3/relations/650
                method: patch
              delete:
                href: /api/v3/relations/650
                method: delete,
                title: Remove relation
              from:
                href: /api/v3/work_packages/108
                title: Destroy Rebel Base
              to:
                href: /api/v3/work_packages/78
                title: Annihilate Yavin 4
          - _type: Relation
            id: 652
            name: relates to
            type: relates
            reverseType: relates
            _hint: Relation resource shortened for brevity.
          - _hint: Further relation resources shortened for brevity.
        _links:
          self:
            href: /api/v3/relations?filters=%5B%5D&offset=1&pageSize=20
          jumpTo:
            href: /api/v3/relations?filters=%5B%5D&offset=%7Boffset%7D&pageSize=20
            templated: true
          changeSize:
            href: /api/v3/relations?filters=%5B%5D&offset=1&pageSize=%7Bsize%7D
            templated: true
          nextByOffset:
            href: /api/v3/relations?filters=%5B%5D&offset=2&pageSize=20
    RelationCreateRequest:
      description: Example request to create a relation between two work packages.
      value:
        type: follows
        lag: 2
        description: Build hangar AFTER improving external skeleton of Death Star.
        _links:
          to:
            href: /api/v3/work_packages/1337
    RelationResponse:
      description: Simple response of a 'duplicated by' relation between two work packages.
      value:
        _type: Relation
        id: 650
        name: duplicated by
        type: duplicated
        reverseType: duplicates
        lag: null
        description: Those are the same... stupid Stormtroopers!
        _embedded:
          from:
            id: 108
            _type: WorkPackage
            _abbreviated: Work package resource shortened for brevity.
          to:
            id: 78
            _type: WorkPackage
            _abbreviated: Work package resource shortened for brevity.
        _links:
          self:
            href: /api/v3/relations/650
          updateImmediately:
            href: /api/v3/relations/650
            method: patch
          delete:
            href: /api/v3/relations/650
            method: delete,
            title: Remove relation
          from:
            href: /api/v3/work_packages/108
            title: Destroy Rebel Base
          to:
            href: /api/v3/work_packages/78
            title: Annihilate Yavin 4
    RelationUpdateRequest:
      description: Example request to update the relation's description.
      value:
        description: This is the new description.
  schemas:
    CollectionLinks:
      type: object
      required:
      - self
      properties:
        self:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: 'This collection resource.


              **Resource**: Collection'
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type:
          - string
          - 'null'
          description: URL to the referenced resource (might be relative)
        title:
          type: string
          description: Representative label for the resource
        templated:
          type: boolean
          default: false
          description: If true the href contains parts that need to be replaced by the client
        method:
          type: string
          default: GET
          description: The HTTP verb to use when requesting the resource
        payload:
          type: object
          description: The payload to send in the request to achieve the desired result
        identifier:
          type: string
          description: An optional unique identifier to the link object
        type:
          type: string
          description: The MIME-Type of the returned resource.
      example:
        href: /api/v3/work_packages
        method: POST
    WorkPackageModel:
      allOf:
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        required:
        - subject
        - _links
        properties:
          id:
            type: integer
            description: Work package id
            readOnly: true
            minimum: 1
          lockVersion:
            type: integer
            description: The version of the item as used for optimistic locking
            readOnly: true
          subject:
            type: string
            description: Work package subject
          _type:
            type: string
            enum:
            - WorkPackage
            readOnly: true
          description:
            allOf:
            - $ref: '#/components/schemas/Formattable'
            - description: The work package description
          scheduleManually:
            type: boolean
            description: 'Uses manual scheduling mode when true (default). Uses automatic scheduling

              mode when false. Can be automatic only when predecessors or children are

              present.'
          readonly:
            type: boolean
            description: If true, the work package is in a readonly status so with the exception of the status, no other property can be altered.
          startDate:
            type:
            - string
            - 'null'
            format: date
            description: Scheduled beginning of a work package
          dueDate:
            type:
            - string
            - 'null'
            format: date
            description: Scheduled end of a work package
          date:
            type:
            - string
            - 'null'
            format: date
            description: Date on which a milestone is achieved
          derivedStartDate:
            type:
            - string
            - 'null'
            format: date
            description: Similar to start date but is not set by a client but rather deduced by the work packages' descendants. If manual scheduleManually is active, the two dates can deviate.
            readOnly: true
          derivedDueDate:
            type:
            - string
            - 'null'
            format: date
            description: Similar to due date but is not set by a client but rather deduced by the work packages' descendants. If manual scheduleManually is active, the two dates can deviate.
            readOnly: true
          duration:
            type:
            - string
            - 'null'
            format: duration
            description: '**(NOT IMPLEMENTED)** The amount of time in hours the work package needs to be completed.

              Not available for milestone type of work packages.'
            readOnly: true
          estimatedTime:
            type:
            - string
            - 'null'
            format: duration
            description: Time a work package likely needs to be completed excluding its descendants
          derivedEstimatedTime:
            type:
            - string
            - 'null'
            format: duration
            description: Time a work package likely needs to be completed including its descendants
            readOnly: true
          ignoreNonWorkingDays:
            type: boolean
            description: '**(NOT IMPLEMENTED)** When scheduling, whether or not to ignore the non working days being defined.

              A work package with the flag set to true will be allowed to be scheduled to a non working day.'
            readOnly: true
          position:
            type:
            - integer
            - 'null'
            description: 'The position this work package has in a version configured to be backlog (sprint or product).


              # Conditions


              **Permission** Backlogs needs to be enabled in the work package''s project and the work package''s type is configured to be a backlog type.'
            readOnly: true
          spentTime:
            type: string
            format: duration
            description: 'The time booked for this work package by users working on it


              # Conditions


              **Permission** view time entries'
            readOnly: true
          storyPoints:
            type:
            - integer
            - 'null'
            description: 'The estimation in story points on how long this work package will take to complete


              # Conditions


              **Permission** Backlogs needs to be enabled in the work package''s project and the work package''s type is configured to be a backlog type.'
            readOnly: false
          percentageDone:
            type:
            - integer
            - 'null'
            description: Amount of total completion for a work package
            minimum: 0
            maximum: 100
          derivedPercentageDone:
            type:
            - integer
            - 'null'
            description: Amount of total completion for a work package derived from itself and its descendant work packages
            readOnly: true
            minimum: 0
            maximum: 100
          createdAt:
            type: string
            format: date-time
            description: Time of creation. Can be writable by admins with the `apiv3_write_readonly_attributes` setting enabled.
            readOnly: true
          updatedAt:
            type: string
            format: date-time
            description: Time of the most recent change to the work package.
            readOnly: true
          _links:
            type: object
            required:
            - self
            - schema
            - ancestors
            - author
            - priority
            - project
            - status
            - type
            properties:
              addComment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Post comment to WP


                    # Conditions


                    **Permission**: add work package notes'
                  readOnly: true
              addRelation:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Adds a relation to this work package.


                    # Conditions


                    **Permission**: manage wp relations'
                  readOnly: true
              addWatcher:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add any user to WP watchers


                    # Conditions


                    **Permission**: add watcher'
                  readOnly: true
              customActions:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A predefined action that can be applied to the work package.


                      **Resource**: CustomAction'
                    readOnly: true
              previewMarkup:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: Post markup (in markdown) here to receive an HTML-rendered response
                  readOnly: true
              removeWatcher:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Remove any user from WP watchers


                    # Conditions


                    **Permission**: delete watcher'
                  readOnly: true
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Delete this work package


                    # Conditions


                    **Permission**: delete_work_packages'
                  readOnly: true
              logTime:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Create time entries on the work package


                    # Conditions


                    **Permission**: log_time or log_own_time'
                  readOnly: true
              move:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Link to page for moving this work package


                    # Conditions


                    **Permission**: move_work_packages'
                  readOnly: true
              copy:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Link to page for copying this work package


                    # Conditions


                    **Permission**: add_work_packages'
                  readOnly: true
              unwatch:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Remove current user from WP watchers


                    # Conditions


                    logged in; watching'
                  readOnly: true
              update:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Form endpoint that aids in preparing and performing edits on a work package


                    # Conditions


                    **Permission**: edit work package'
                  readOnly: true
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Directly perform edits on a work package


                    # Conditions


                    **Permission**: edit work package'
                  readOnly: true
              watch:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add current user to WP watchers


                    # Conditions


                    logged in; not watching'
                  readOnly: true
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This work package


                    **Resource**: WorkPackage'
                  readOnly: true
              schema:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The schema of this work package


                    **Resource**: Schema'
                  readOnly: true
              ancestors:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A visible ancestor work package of the current work package.


                      **Resource**: WorkPackage


                      # Conditions


                      **Permission** view work packages'
                    readOnly: true
              attachments:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The files attached to this work package


                    **Resource**: Collection


                    # Conditions


                    - **Setting**: deactivate_work_package_attachments set to false in related workspace'
              addAttachment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Attach a file to the work package


                    # Conditions


                    - **Permission**: edit work package'
                  readOnly: true
              prepareAttachment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Attach a file to the work package


                    # Conditions


                    - **Setting**: direct uploads enabled'
                  readOnly: true
              author:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The person that created the work package


                    **Resource**: User'
                  readOnly: true
              assignee:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The person that is intended to work on the work package


                    **Resource**: User'
              availableWatchers:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'All users that can be added to the work package as watchers.


                    **Resource**: User


                    # Conditions


                    **Permission** add work package watchers'
                  readOnly: true
              budget:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The budget this work package is associated to


                    **Resource**: Budget


                    # Conditions


                    **Permission** view cost objects'
              category:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The category of the work package


                    **Resource**: Category'
              children:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A visible child work package of the current work package.


                      **Resource**: WorkPackage


                      # Conditions


                      **Permission** view work packages'
                    readOnly: true
              addFileLink:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add a file link to the work package


                    # Conditions


                    **Permission**: manage_file_links'
              fileLinks:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Gets the file link collection of this work package


                    # Conditions


                    **Permission**: view_file_links'
              parent:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Parent work package


                    **Resource**: WorkPackage'
              priority:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The priority of the work package


                    **Resource**: Priority'
              project:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The workspace to which the work package belongs


                    **Resource**: Workspace'
              projectPhase:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The project phase to which the work package belongs


                    **Resource**: ProjectPhase'
              projectPhaseDefinition:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The definition of the project phase the work package belongs to


                    **Resource**: ProjectPhaseDefinition'
              responsible:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The person that is responsible for the overall outcome


                    **Resource**: User'
              relations:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Relations this work package is involved in


                    **Resource**: Relation


                    # Conditions


                    **Permission** view work packages'
                  readOnly: true
              revisions:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Revisions that are referencing the work package


                    **Resource**: Revision


                    # Conditions


                    **Permission** view changesets'
                  readOnly: true
              status:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The current status of the work package


                    **Resource**: Status'
              sprint:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The sprint the work package is assigned to


                    **Resource**: Sprint


                    # Conditions


                    **Permission** view sprints'
              timeEntries:
                allOf:
