openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Configuration API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- description: The configuration endpoint allows to read certain configuration parameters of the OpenProject instance.
  name: Configuration
paths:
  /api/v3/configuration:
    get:
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _type: Configuration
                    _links:
                      self:
                        href: /api/v3/configuration
                      userPreferences:
                        href: /api/v3/my_preferences
                    maximumAttachmentFileSize: 5242880
                    hostName: example.com:8080
                    perPageOptions:
                    - 1
                    - 10
                    - 100
                    durationFormat: hours_only
                    activeFeatureFlags:
                    - aFeatureFlag
                    - anotherFeatureFlag
              schema:
                $ref: '#/components/schemas/ConfigurationModel'
          description: OK
          headers: {}
      tags:
      - Configuration
      description: ''
      operationId: View_configuration
      summary: View configuration
  /api/v3/projects/{id}/configuration:
    get:
      parameters:
      - description: Project id
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _type: Configuration
                    _links:
                      self:
                        href: /api/v3/projects/1/configuration
                      userPreferences:
                        href: /api/v3/my_preferences
                    maximumAttachmentFileSize: 5242880
                    perPageOptions:
                    - 20
                    - 100
                    enabledInternalComments: true
              schema:
                $ref: '#/components/schemas/ProjectConfigurationModel'
          description: OK
          headers: {}
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: Returned if the project does not exist or the user cannot view it.
          headers: {}
      tags:
      - Configuration
      description: 'Returns the configuration scoped to a specific project, including all global

        configuration properties plus project-specific settings.'
      operationId: View_project_configuration
      summary: View project configuration
components:
  schemas:
    ProjectConfigurationModel:
      allOf:
      - $ref: '#/components/schemas/ConfigurationModel'
      - type: object
        properties:
          enabledInternalComments:
            type: boolean
            description: Whether internal comments are enabled for this project
            readOnly: true
    ErrorResponse:
      type: object
      required:
      - _type
      - errorIdentifier
      - message
      properties:
        _embedded:
          type: object
          properties:
            details:
              type: object
              properties:
                attribute:
                  type: string
                  example: project
        _type:
          type: string
          enum:
          - Error
        errorIdentifier:
          type: string
          example: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
        message:
          type: string
          example: Project can't be blank.
    ConfigurationModel:
      type: object
      properties:
        maximumAttachmentFileSize:
          type: integer
          description: The maximum allowed size of an attachment in Bytes
          readOnly: true
        hostName:
          type: string
          description: The host name configured for the system
          readOnly: true
        perPageOptions:
          type: array
          description: Page size steps to be offered in paginated list UI
          items:
            type: integer
        durationFormat:
          type: string
          description: The format used to display Work, Remaining Work, and Spent time durations
          readOnly: true
        activeFeatureFlags:
          type: array
          description: The list of all feature flags that are active
          items:
            type: string
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
