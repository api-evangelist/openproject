                method: post
              categories:
                href: /api/v3/projects/14/categories
              versions:
                href: /api/v3/projects/14/versions
            id: 14
            identifier: another_project
            name: Another project
            description: ''
            createdAt: '2016-02-29T12:50:20+00:00'
            updatedAt: '2016-02-29T12:50:20+00:00'
            type: null
    CustomFieldLinkedProperties:
      type: object
      patternProperties:
        ^customField\d+$:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: 'A custom field value that belongs to a custom field of a reference type:


              - Hierarchy

              - List

              - User

              - Version

              - Weighted item list'
    VersionReadModel:
      allOf:
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        required:
        - id
        - _type
        - name
        - description
        - startDate
        - endDate
        - status
        - sharing
        - createdAt
        - updatedAt
        properties:
          id:
            type: integer
            description: Version id
            minimum: 1
          _type:
            type: string
            enum:
            - Version
          name:
            type: string
            description: Version name
          description:
            $ref: '#/components/schemas/Formattable'
          startDate:
            type:
            - string
            - 'null'
            format: date
          endDate:
            type:
            - string
            - 'null'
            format: date
          status:
            type: string
            description: 'The current status of the version. This could be:


              - *open*: if the version is available to be assigned to work packages in all shared projects

