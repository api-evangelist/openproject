                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: 'Returned if the version does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:** view work packages **or** manage versions (any project where the version is available)


