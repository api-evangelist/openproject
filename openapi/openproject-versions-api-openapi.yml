security:
- BasicAuth: []
tags:
- description: 'Work Packages can be assigned to a version. As such, versions serve to group Work Packages into logical units where each group comprises all the work packages that needs to be finished in order for the version to be finished.


    ## Actions


    | Link                | Description                                                              | Condition                              |

    |:-------------------:|--------------------------------------------------------------------------| ---------------------------------------|

    | update              | Form endpoint that aids in preparing and performing edits on the version | **Permission**: manage versions        |

    | updateImmediately   | Directly perform edits on the version                                    | **Permission**: manage versions        |


    ## Linked Properties


    |  Link               | Description                                | Type          | Constraints                                                    | Supported operations |

    |:-------------------:|-----------------------------------------   | ------------- | -------------------------------------------------------------- | -------------------- |

    | self                | This version                               | Version       | not null                                                       | READ                 |

    | definingProject     | The workspace to which the version belongs | Workspace     | only present if the workspace is visible for the current user  | READ                 |

    | availableInProjects | Workspaces where this version can be used  | Workspaces    | not null                                                       | READ                 |


    Depending on custom fields defined for versions, additional linked properties might exist.


    ## Local Properties


    | Property    | Description                                   | Type        | Constraints                                        | Supported operations |

    | :---------: | --------------------------------------------- | ----------- | -----------                                        | -------------------- |

    | id          | Version id                                    | Integer     | x > 0                                              | READ                 |

    | name        | Version name                                  | String      | not null, may not exceed 60 characters             | READ / WRITE         |

    | description |                                               | Formattable |                                                    | READ / WRITE         |

    | startDate   |                                               | Date        |                                                    | READ / WRITE         |

    | endDate     |                                               | Date        |                                                    | READ / WRITE         |

    | status      | The current status of the version             | String      | not null, only ''open'', ''finished'', ''closed''        | READ / WRITE         |

    | sharing     | The current status of the version             | String      | not null, limited to fixed set as defined by form  | READ / WRITE         |

    | createdAt   | Time of creation                              | DateTime    | not null                                           | READ                 |

    | updatedAt   | Time of the most recent change to the version | DateTime    | not null                                           | READ                 |


    Depending on custom fields defined for versions, additional properties might exist.'
  name: Versions
paths:
  /api/v3/projects/{id}/versions:
    get:
      parameters:
      - description: ID of the project whose versions will be listed
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _embedded:
                      elements:
                      - _links:
                          availableInProjects:
                            href: /api/v3/versions/11/workspaces
                          definingProject:
                            href: /api/v3/projects/11
                          self:
                            href: /api/v3/versions/11
                        _type: Version
                        description:
                          format: plain
                          html: This version has a description
                          raw: This version has a description
                        endDate: null
                        id: 11
                        name: v3.0 Alpha
                        startDate: '2014-11-20'
                        status: Open
                      - _links:
                          availableInProjects:
                            href: /api/v3/versions/12/workspaces
                          definingProject:
                            href: /api/v3/projects/11
                          self:
                            href: /api/v3/versions/12
                        _type: Version
                        description:
                          format: plain
                          html: ''
                          raw: ''
                        endDate: null
                        id: 12
                        name: v2.0
                        startDate: null
                        status: Closed
                      - _links:
                          availableInProjects:
                            href: /api/v3/versions/10/workspaces
                          definingProject:
                            href: /api/v3/projects/11
                          self:
                            href: /api/v3/versions/10
                        _type: Version
                        description:
                          format: plain
                          html: ''
                          raw: ''
                        endDate: null
                        id: 10
                        name: v1.0
                        startDate: null
                        status: Open
                    _links:
                      self:
                        href: /api/v3/projects/11/versions
                    _type: Collection
                    count: 3
                    total: 3
              schema:
                $ref: '#/components/schemas/Versions_by_WorkspaceModel'
          description: OK
          headers: {}
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified project does not exist.
          description: 'Returned if the project does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:** view work packages **or** manage versions (on given project)


            *Note: A client without sufficient permissions shall not be able to test for the existence of a project.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
          headers: {}
      tags:
      - Versions
      description: 'This endpoint lists the versions that are *available* in a given project.

        Note that due to sharing this might be more than the versions *defined* by that project.


        This endpoint is deprecated and replaced by [`/api/v3/workspaces/{id}/versions`](https://www.openproject.org/docs/api/endpoints/versions/#list-versions-available-in-a-workspace)'
      operationId: List_versions_available_in_a_project
      summary: List versions available in a project
  /api/v3/versions:
    get:
      summary: List versions
      operationId: list_versions
      tags:
      - Versions
      description: 'Returns a collection of versions. The client can choose to filter the versions similar to how work packages are

        filtered. In addition to the provided filters, the server will reduce the result set to only contain versions,

        for which the requesting client has sufficient permissions (*view_work_packages*).'
      parameters:
      - name: filters
        description: 'JSON specifying filter conditions. Accepts the same format as returned by

          the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. Currently supported

          filters are:


          - sharing: filters versions by how they are shared within the server (*none*, *descendants*, *hierarchy*, *tree*, *system*).

          - name: filters versions by their name.'
        example: '[{ "sharing": { "operator": "=", "values": ["system"] } }]'
        in: query
        required: false
        schema:
          type: string
      - name: sortBy
        description: 'JSON specifying sort criteria. Accepts the same format as returned by

          the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. Currently supported

          attributes are:


          - id: Sort by the version id

          - name: Sort by the version name using numeric collation, comparing sequences of decimal digits by their numeric value'
        example: '[["name", "desc"]]'
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/VersionCollectionModel'
    post:
      summary: Create version
      operationId: create_version
      tags:
      - Versions
      description: 'Creates a new version applying the attributes provided in the body. Please note that while there is a fixed set

        of attributes, custom fields can extend a version''s attributes and are accepted by the endpoint.


        You can use the form and schema to be retrieve the valid attribute values and by that be guided towards

        successful creation.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionWriteModel'
            examples:
              create version:
                $ref: '#/components/examples/VersionCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/VersionReadModel'
              examples:
                response:
                  $ref: '#/components/examples/VersionSimpleResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Manage versions'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'Returned if:


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
  /api/v3/versions/available_projects:
    get:
      responses:
        '200':
          content:
            application/hal+json:
              examples:
