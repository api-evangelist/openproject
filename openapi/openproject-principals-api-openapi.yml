openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Principals API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- description: 'Principals are the superclass of users, groups and placeholder users. This endpoint returns all principals

    within a joined collection but can be filtered to e.g. only return groups or users.'
  name: Principals
paths:
  /api/v3/placeholder_users:
    get:
      summary: List placehoder users
      operationId: list_placeholder_users
      tags:
      - Principals
      description: 'List all placeholder users. This can only be accessed if the requesting user has the global permission

        `manage_placeholder_user` or `manage_members` in any project.'
      parameters:
      - name: filters
        description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.

          Currently supported filters are:


          - name: filters placeholder users by the name.

          - group: filters placeholder by the group it is contained in.

          - status: filters placeholder by the status it has.'
        in: query
        required: false
        schema:
          type: string
        example: '[{ "name": { "operator": "~", "values": ["Darth"] } }]'
      - name: select
        description: Comma separated list of properties to include.
        in: query
        required: false
        schema:
          type: string
        example: total,elements/name,elements/self,self
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PrincipalCollectionModel'
        '400':
          description: Returned if the client sends invalid request parameters e.g. filters
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:InvalidQuery
                message: Filters Invalid filter does not exist.
    post:
      summary: Create placeholder user
      operationId: create_placeholder_user
      tags:
      - Principals
      description: 'Creates a new placeholder user. Only administrators and users with `manage_placeholder_user` global permission are

        allowed to do so. When calling this endpoint the client provides a single object, containing at least the

        properties and links that are required, in the body.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceholderUserCreateModel'
      responses:
        '201':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PlaceholderUserModel'
          description: Created
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to create new placeholder users.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Administrator'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _embedded:
                  details:
                    attribute: name
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Name has already been taken.
          description: 'Returned if:


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
  /api/v3/placeholder_users/{id}:
    delete:
      summary: Delete placeholder user
      operationId: delete_placeholder_user
      description: Set the specified placeholder user to deleted status.
      tags:
      - Principals
      parameters:
      - description: Placeholder user id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: 'Returned if the group was marked for deletion.


            Note that the response body is empty as of now. In future versions of the API a body

            *might* be returned, indicating the progress of deletion.'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to delete the account of this user.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** `manage_placeholder_users`'
        '404':
          description: Returned if the placeholder user does not exist.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified placeholder user does not exist.
    get:
      summary: View placeholder user
      operationId: view_placeholder_user
      description: Return the placeholder user resource.
      tags:
      - Principals
      parameters:
      - description: The placeholder user id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PlaceholderUserModel'
              examples:
                placeholder user response:
                  $ref: '#/components/examples/PlaceholderUserResponse'
          description: OK
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified placeholder user does not exist or you do not have permission to view them.
          description: 'Returned if the user does not exist or if the API user does not have permission to view them.


            **Required permission**: `manage_placeholder_users`'
    patch:
      summary: Update placeholder user
      operationId: update_placeholder_user
      tags:
      - Principals
      description: 'Updates the placeholder user''s writable attributes.

        When calling this endpoint the client provides a single object, containing at least the properties and links

        that are required, in the body.'
      parameters:
      - description: Placeholder user id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceholderUserCreateModel'
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PlaceholderUserModel'
          description: OK
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to update the account of this user.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission**: `manage_placeholder_users`'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified placeholder user does not exist.
          description: Returned if the placeholder user does not exist.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _embedded:
                  details:
                    attribute: name
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Name has already been taken.
          description: 'Returned if:


            - the client tries to modify a read-only property (`PropertyIsReadOnly`)

            - a constraint for a property was violated (`PropertyConstraintViolation`)'
  /api/v3/principals:
    get:
      summary: List principals
      operationId: list_principals
      tags:
      - Principals
      description: 'List all principals. The client can choose to filter the principals similar to how work packages are filtered. In

        addition to the provided filters, the server will reduce the result set to only contain principals who are members

        in projects the client is allowed to see.'
      parameters:
      - name: filters
        description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.

          Currently supported filters are:


          - type: filters principals by their type (*User*, *Group*, *PlaceholderUser*).

          - member: filters principals by the projects they are members in.

          - name: filters principals by the user or group name.

          - any_name_attribute: filters principals by the user or group first- and last name, email or login.

          - status: filters principals by their status number (active = *1*, registered = *2*, locked = *3*, invited = *4*)'
        in: query
        required: false
        schema:
          type: string
        example: '[{ "type": { "operator": "=", "values": ["User"] } }]'
      - name: select
        description: Comma separated list of properties to include.
        in: query
        required: false
        schema:
          type: string
        example: total,elements/name,elements/self,self
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PrincipalCollectionModel'
        '400':
          description: Returned if the client sends invalid request parameters e.g. filters
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:InvalidQuery
                message: Filters Invalid filter does not exist.
  /api/v3/users:
    get:
      summary: List Users
      operationId: list_Users
      description: 'Lists users. Only administrators or users with the following global permission can access this resource:

        - `manage_user`'
      tags:
      - Principals
      parameters:
      - description: Page number inside the requested collection.
        example: '25'
        in: query
        name: offset
        required: false
        schema:
          default: 1
          type: integer
      - description: Number of elements to display per page.
        example: '25'
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/)

          endpoint. Currently supported filters are:


          + status: Status the user has


          + group: Name of the group in which to-be-listed users are members.


          + name: Filter users in whose first or last names, or email addresses the given string occurs.


          + login: User''s login'
        example: '[{ "status": { "operator": "=", "values": ["invited"] } }, { "group": { "operator": "=", "values": ["1"] } }, { "name": { "operator": "=", "values": ["h.wurst@openproject.com"] } }]'
        in: query
        name: filters
        required: false
        schema:
          type: string
      - description: 'JSON specifying sort criteria.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.'
        example: '[["status", "asc"]]'
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: Comma separated list of properties to include.
        example: total,elements/name,elements/self,self
        in: query
        name: select
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserCollectionModel'
          description: OK
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to list users.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Administrator or any of: ''manage_members'', ''manage_user'', ''share_work_packages''.'
    post:
      summary: Create User
      operationId: create_user
      tags:
      - Principals
      description: 'Creates a new user. Only administrators and users with manage_user global permission are allowed to do so.

        When calling this endpoint the client provides a single object, containing at least the properties and links that are required, in the body.


        Valid values for `status`:


        1) "active" - In this case a password has to be provided in addition to the other attributes.


        2) "invited" - In this case nothing but the email address is required. The rest is optional. An invitation will be sent to the user.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateModel'
      responses:
        '201':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserModel'
          description: Created
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to create new users.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Administrator'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _embedded:
                  details:
                    attribute: email
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: The email address is already taken.
          description: 'Returned if:


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
  /api/v3/users/{id}:
    delete:
      summary: Delete user
      operationId: delete_user
      description: Permanently deletes the specified user account.
      tags:
      - Principals
      parameters:
      - description: User id. Use `me` to reference current user, if any.
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: 'Returned if the account was deleted successfully.


            Note that the response body is empty as of now. In future versions of the API a body

            *might* be returned, indicating the progress of deletion.'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to delete the account of this user.
          description: 'Returned if the client does not have sufficient permissions or if deletion of users was disabled in the instance wide settings.


            **Required permission:** Administrators only (exception: users might be able to delete their own accounts)'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified user does not exist.
          description: Returned if the user does not exist.
    get:
      summary: View user
      operationId: view_user
      description: ''
      tags:
      - Principals
      parameters:
      - description: User id. Use `me` to reference current user, if any.
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserModel'
              examples:
                user response:
                  $ref: '#/components/examples/UserResponse'
          description: OK
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified user does not exist or you do not have permission to view them.
          description: 'Returned if the user does not exist or if the API user does not have permission to view them.


            **Required permission** The user needs to be locked in if the installation is configured to prevent anonymous access'
    patch:
      summary: Update user
      operationId: update_user
      tags:
      - Principals
      description: 'Updates the user''s writable attributes.

        When calling this endpoint the client provides a single object, containing at least the properties and links that are required, in the body.


        Password updates for self-service account changes require both `password` and `currentPassword`.'
      parameters:
      - description: User id. Use `me` to reference current user, if any.
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateModel'
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserModel'
          description: OK
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to update the account of this user.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** Administrators, manage_user global permission'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified user does not exist or you do not have permission to view them.
          description: 'Returned if the user does not exist or if the API user does not have the necessary permissions to update it.


            **Required permission:** Administrators only (exception: users may update their own accounts)'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email constraint violation:
                  value:
                    _embedded:
                      details:
                        attribute: email
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: The email address is already taken.
                invalid current password:
                  value:
                    _embedded:
                      details:
                        attribute: currentPassword
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: Current password is invalid.
          description: 'Returned if:


            * the client tries to modify a read-only property (`PropertyIsReadOnly`)


            * a constraint for a property was violated (`PropertyConstraintViolation`)'
components:
  examples:
    UserResponse:
      value:
        _type: User
        id: 14
        name: Mara Jade
        createdAt: '2022-04-04T08:07:22.910Z'
        updatedAt: '2024-02-09T09:01:17.382Z'
        login: member
        admin: false
        firstName: Mara
        lastName: Jade
        email: m.jade@empire.org
        avatar: https://secure.gravatar.com/avatar/17dd23570f3bd129d06db9b48b7a41b8?default=404&secure=true
        status: active
        identityUrl: null
        language: en
        _links:
          self:
            href: /api/v3/users/14
            title: Mara Jade
          memberships:
            href: /api/v3/memberships?filters=%5B%7B%22principal%22%3A%7B%22operator%22%3A%22%3D%22%2C%22values%22%3A%5B%2214%22%5D%7D%7D%5D
            title: Memberships
          showUser:
            href: /users/14
            type: text/html
          updateImmediately:
            href: /api/v3/users/14
            title: Update member
            method: patch
          lock:
            href: /api/v3/users/14/lock
            title: Set lock on member
            method: post
          delete:
            href: /api/v3/users/14
            title: Delete member
            method: delete
    PlaceholderUserResponse:
      value:
        _type: PlaceholderUser
        id: 27
        name: Akolyth
        createdAt: '2024-02-12T11:52:24.708Z'
        updatedAt: '2024-02-12T11:52:24.708Z'
        _links:
          self:
            href: /api/v3/placeholder_users/27
            title: Akolyth
          memberships:
            href: /api/v3/memberships?filters=%5B%7B%22principal%22%3A%7B%22operator%22%3A%22%3D%22%2C%22values%22%3A%5B%2227%22%5D%7D%7D%5D
            title: Memberships
          updateImmediately:
            href: /api/v3/placeholder_users/27
            title: Update Akolyth
            method: patch
          delete:
            href: /api/v3/placeholder_users/27
            title: Delete Akolyth
            method: delete
          showUser:
            href: /placeholder_users/27
            type: text/html
  schemas:
    OffsetPaginatedCollectionLinks:
      allOf:
      - $ref: '#/components/schemas/CollectionLinks'
      - type: object
        required:
        - jumpTo
        - changeSize
        properties:
          jumpTo:
            allOf:
            - $ref: '#/components/schemas/Link'
            - description: A templated link to jump to a given offset.
          changeSize:
            allOf:
            - $ref: '#/components/schemas/Link'
            - description: A templated link to change the current page size.
          previousByOffset:
            allOf:
            - $ref: '#/components/schemas/Link'
            - description: 'A link to the previous page of the collection.


                # Conditions

                - The collection is not on the first page.'
          nextByOffset:
            allOf:
            - $ref: '#/components/schemas/Link'
            - description: 'A link to the next page of the collection.


                # Conditions

                - The collection is not on the last page.'
    CustomFieldProperties:
      type: object
      patternProperties:
        ^customField\d+$:
          type:
          - 'null'
          - number
          - boolean
          - string
          - object
          description: 'A custom field value, that belongs to a custom field of a simple type:


            - Boolean

            - Date

            - Float

            - Integer

            - Link (URL)

            - Text

            - Long text'
    UserModel:
      allOf:
      - $ref: '#/components/schemas/PrincipalModel'
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        required:
        - _type
        - avatar
        properties:
          _type:
            type: string
            enum:
            - User
          avatar:
            type:
            - string
            - 'null'
            format: uri
            description: URL to user's avatar
          login:
            type: string
            description: 'The user''s login name


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
            maxLength: 256
          firstName:
            type: string
            description: 'The user''s first name


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
            maxLength: 30
          lastName:
            type: string
            description: 'The user''s last name


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
            maxLength: 30
          email:
            type: string
            description: 'The user''s email address


              # Conditions


              - E-Mail address not hidden

              - User is not a new record

              - User is self, or `create_user` or `manage_user` permission globally'
            maxLength: 60
          admin:
            type: boolean
            description: 'Flag indicating whether or not the user is an admin


              # Conditions


              - `admin`'
          status:
            type: string
            description: 'The current activation status of the user.


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
          language:
            type: string
            description: 'User''s language | ISO 639-1 format


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
          identityUrl:
            type:
            - string
            - 'null'
            description: 'User''s identity_url for OmniAuth authentication.

              **Deprecated:** It will be removed in the near future.


              # Conditions


              - User is self, or `create_user` or `manage_user` permission globally'
            deprecated: true
          createdAt:
            type: string
            format: date-time
            description: Time of creation
          updatedAt:
            type: string
            format: date-time
            description: Time of the most recent change to the user
          _links:
            type: object
            properties:
              showUser:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'A relative path to show the user in the web application.


                    # Condition


                    - User is not a new record

                    - User is not `locked`'
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'A link to update the user resource.


                    # Conditions


                    - `admin`'
              lock:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Restrict the user from logging in and performing any actions.


                    # Conditions


                    - User is not locked

                    - `admin`'
              unlock:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Allow a locked user to login and act again.


                    # Conditions


                    - User is not locked

                    - `admin`'
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: "Permanently remove a user from the instance\n\n# Conditions\n\neither:\n  - `admin`\n  - Setting `users_deletable_by_admin` is set\nor:\n  - User is self\n  - Setting `users_deletable_by_self` is set"
              authSource:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Permanently remove a user from the instance


                    # Conditions


                    - LDAP authentication configured

                    - `admin`'
    PlaceholderUserCreateModel:
      type: object
      properties:
        name:
          type: string
          description: The new name of the placeholder user to be created.
    PlaceholderUserModel:
      allOf:
      - $ref: '#/components/schemas/PrincipalModel'
      - type: object
        required:
        - _type
        properties:
          _type:
            type: string
            enum:
            - PlaceholderUser
          status:
            type: string
            description: 'The current activation status of the placeholder user.


              # Conditions


              - User has `manage_placeholder_user` permission globally'
          _links:
            type: object
            required:
            - showUser
            properties:
              showUser:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: A relative path to show the placeholder user in the web application.
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'An href to delete the placeholder user.


                    # Conditions:


                    - `manage_placeholder_user`'
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'An href to update the placeholder user.


                    # Conditions:


                    - `manage_placeholder_user`


                    **Resource**: PlaceholderUser'
    UserCollectionModel:
      allOf:
      - $ref: '#/components/schemas/CollectionModel'
      - type: object
        required:
        - _links
        - _embedded
        properties:
          _links:
            type: object
            required:
            - self
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This user collection


                    **Resource**: Collection'
          _embedded:
            type: object
            required:
            - elements
            properties:
              elements:
                type: array
                items:
                  $ref: '#/components/schemas/UserModel'
      example:
        _type: Collection
        total: 2
        count: 2
        _links:
          self:
            href: /api/v3/users
        _embedded:
          elements:
          - _abbreviated: User resource shortened for brevity
            _type: User
            id: 1337
          - _abbreviated: User resource shortened for brevity
            _type: User
            id: 1338
    PrincipalCollectionModel:
      allOf:
      - $ref: '#/components/schemas/OffsetPaginatedCollectionModel'
      - type: object
        required:
        - _embedded
        properties:
          _embedded:
            type: object
            required:
            - elements
            properties:
              elements:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/UserModel'
                  - $ref: '#/components/schemas/PlaceholderUserModel'
                  - $ref: '#/components/schemas/GroupModel'
      example:
        _type: Collection
        total: 3
        count: 3
        _links:
          self:
            href: /api/v3/principals
        _embedded:
          elements:
          - _abbreviated: User resource shortened for brevity
            _type: User
            id: 1337
          - _abbreviated: Group resource shortened for brevity
            _type: Group
            id: 1338
          - _abbreviated: PlaceholderUser resource shortened for brevity
            _type: PlaceholderUser
            id: 1339
    CollectionLinks:
      type: object
      required:
      - self
      properties:
        self:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: 'This collection resource.


              **Resource**: Collection'
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type:
          - string
          - 'null'
          description: URL to the referenced resource (might be relative)
        title:
          type: string
          description: Representative label for the resource
        templated:
          type: boolean
          default: false
          description: If true the href contains parts that need to be replaced by the client
        method:
          type: string
          default: GET
          description: The HTTP verb to use when requesting the resource
        payload:
          type: object
          description: The payload to send in the request to achieve the desired result
        identifier:
          type: string
          description: An optional unique identifier to the link object
        type:
          type: string
          description: The MIME-Type of the returned resource.
      example:
        href: /api/v3/work_packages
        method: POST
    GroupModel:
      allOf:
      - $ref: '#/components/schemas/PrincipalModel'
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        required:
        - _type
        - _embedded
        properties:
          _type:
            type: string
            enum:
            - Group
          _embedded:
            type: object
            properties:
              members:
                type: array
                description: Embedded list of members.
                items:
                  $ref: '#/components/schemas/UserModel'
          _links:
            type: object
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This group resource


                    **Resource**: Group'
              members:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A member of the group


                      # Conditions:


                      - user has permission `manage_members` in any project


                      **Resource**: User'
              memberships:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'An collection of all memberships of the group.


                    **Resource**: MembershipCollection'
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'An href to delete the group.


                    # Conditions:


                    - `admin`'
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'An href to update the group.


                    # Conditions:


                    - `admin`


                    **Resource**: Group'
    OffsetPaginatedCollectionModel:
      allOf:
      - $ref: '#/components/schemas/CollectionModel'
      - type: object
        required:
        - pageSize
        - offset
        - _links
        properties:
          pageSize:
            type: integer
            description: 'The amount of elements per page. If not set by the request this value defaults to the server''s system

              settings.'
            minimum: 0
          offset:
            type: integer
            description: The page offset indicating on which page the element collection starts.
            minimum: 0
          _links:
            $ref: '#/components/schemas/OffsetPaginatedCollectionLinks'
    ErrorResponse:
      type: object
      required:
      - _type
      - errorIdentifier
      - message
      properties:
        _embedded:
          type: object
          properties:
            details:
              type: object
              properties:
                attribute:
                  type: string
                  example: project
        _type:
          type: string
          enum:
          - Error
        errorIdentifier:
          type: string
          example: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
        message:
          type: string
          example: Project can't be blank.
    UserCreateModel:
      type: object
      required:
      - admin
      - email
      - login
      - firstName
      - lastName
      - language
      properties:
        admin:
          type: boolean
        email:
          type: string
          maxLength: 60
        login:
          type: string
          maxLength: 256
        password:
          type: string
          description: 'The user''s password.


            *Conditions:*


            Writable on create.


            Writable on update only when:

            - the caller updates their own account

            - `currentPassword` is provided and valid'
        currentPassword:
          type: string
          description: 'The user''s current password.


            *Conditions:*


            Required when changing `password` for a self update (`PATCH /api/v3/users/me` or `PATCH /api/v3/users/{id}` where `id` is the caller).


            Ignored for non-self updates (for example, administrators updating other users).'
        firstName:
          type: string
          maxLength: 30
        lastName:
          type: string
          maxLength: 30
        status:
          type: string
          description: 'The current activation status of the user.


            *Conditions:*


            Only writable on creation, not on update.'
        language:
          type: string
      example:
        login: j.sheppard
        password: idestroyedsouvereign
        currentPassword: iusedtobuildstarships
        firstName: John
        lastName: Sheppard
        email: shep@mail.com
        admin: true
        status: active
        language: en
    CollectionModel:
      type: object
      required:
      - _type
      - total
      - count
      - _links
      properties:
        _type:
          type: string
          enum:
          - Collection
        total:
          type: integer
          description: The total amount of elements available in the collection.
          minimum: 0
        count:
          type: integer
          description: Actual amount of elements in this response.
          minimum: 0
        _links:
          $ref: '#/components/schemas/CollectionLinks'
    PrincipalModel:
      type: object
      required:
      - _type
      - id
      - name
      - _links
      properties:
        _type:
          type: string
          enum:
          - User
          - Group
          - PlaceholderUser
        id:
          type: integer
          description: The principal's unique identifier.
          minimum: 1
        name:
          type: string
          description: The principal's display name, layout depends on instance settings.
        createdAt:
          type: string
          format: date-time
          description: Time of creation
        updatedAt:
          type: string
          format: date-time
          description: Time of the most recent change to the principal
        _links:
          type: object
          required:
          - self
          properties:
            self:
              allOf:
              - $ref: '#/components/schemas/Link'
              - description: 'This principal resource.


                  **Resource**: User|Group|PlaceholderUser'
            memberships:
              allOf:
              - $ref: '#/components/schemas/Link'
              - description: 'An href to the collection of the principal''s memberships.


                  # Conditions:


                  - user has permission `view_members` or `manage_members` in any project


                  **Resource**: Collection'
  responses:
    UnsupportedMediaType:
      description: Occurs when the client sends an unsupported Content-Type header.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:TypeNotSupported
            message: Expected CONTENT-TYPE to be (expected value) but got (actual value).
    InvalidRequestBody:
      description: Occurs when the client did not send a valid JSON object in the request body.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            _type: Error
            errorIdentifier: urn:openproject-org:api:v3:errors:InvalidRequestBody
            message: The request body was not a single JSON object.
    MissingContentType:
      description: Occurs when the client did not send a Content-Type header
      content:
        text/plain:
          schema:
            type: string
          example: Missing content-type header
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
