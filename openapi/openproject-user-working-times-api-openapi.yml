components:
  schemas:
    CollectionModel:
      type: object
      required:
      - _type
      - total
      - count
      - _links
      properties:
        _type:
          type: string
          enum:
          - Collection
        total:
          type: integer
          description: The total amount of elements available in the collection.
          minimum: 0
        count:
          type: integer
          description: Actual amount of elements in this response.
          minimum: 0
        _links:
          $ref: '#/components/schemas/CollectionLinks'
    UserWorkingHoursModel:
      type: object
      required:
      - _type
      - id
      - validFrom
      - mondayHours
      - tuesdayHours
      - wednesdayHours
      - thursdayHours
      - fridayHours
      - saturdayHours
      - sundayHours
      - availabilityFactor
      properties:
        _type:
          type: string
          enum:
          - UserWorkingHours
        id:
          type: integer
          description: The unique identifier of the working hours record.
          minimum: 1
        validFrom:
          type: string
          format: date
          description: 'The date from which this working hours configuration is in effect (ISO 8601 format).

            Multiple records may exist for a user; the one with the latest `validFrom` that is

            not in the future is the currently active record.'
        mondayHours:
          type: number
          format: float
          description: Hours worked on Monday.
          minimum: 0
        tuesdayHours:
          type: number
          format: float
          description: Hours worked on Tuesday.
          minimum: 0
        wednesdayHours:
          type: number
          format: float
          description: Hours worked on Wednesday.
          minimum: 0
        thursdayHours:
          type: number
          format: float
          description: Hours worked on Thursday.
          minimum: 0
        fridayHours:
          type: number
          format: float
          description: Hours worked on Friday.
          minimum: 0
        saturdayHours:
          type: number
          format: float
          description: Hours worked on Saturday.
          minimum: 0
        sundayHours:
          type: number
          format: float
          description: Hours worked on Sunday.
          minimum: 0
        availabilityFactor:
          type: integer
          description: The percentage of working hours the user is available. Must be between 0 and 100.
          minimum: 0
          maximum: 100
        _links:
          type: object
          required:
          - self
          - user
          properties:
            self:
              allOf:
              - $ref: '#/components/schemas/Link'
              - description: 'This working hours record.

                  **Resource**: UserWorkingHours'
            user:
              allOf:
              - $ref: '#/components/schemas/Link'
              - description: 'The user this working hours record belongs to.

                  **Resource**: User'
      example:
        _type: UserWorkingHours
        id: 1
        validFrom: '2024-01-01'
        mondayHours: 8.0
        tuesdayHours: 8.0
        wednesdayHours: 8.0
        thursdayHours: 8.0
        fridayHours: 8.0
        saturdayHours: 0.0
        sundayHours: 0.0
        availabilityFactor: 100
        _links:
          self:
            href: /api/v3/users/42/working_hours/1
          user:
            href: /api/v3/users/42
            title: Jane Doe
    UserWorkingHoursCollectionModel:
      allOf:
      - $ref: '#/components/schemas/CollectionModel'
      - type: object
        required:
        - _links
        - _embedded
        properties:
          _links:
            type: object
            required:
            - self
            properties:
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This collection of working hours records.

                    **Resource**: UserWorkingHoursCollectionModel'
          _embedded:
            type: object
            required:
            - elements
            properties:
              elements:
                type: array
                description: The array of working hours records for the user, ordered by `validFrom` descending.
                items:
                  $ref: '#/components/schemas/UserWorkingHoursModel'
      example:
        _type: Collection
        total: 2
        count: 2
        _links:
          self:
            href: /api/v3/users/42/working_hours
        _embedded:
          elements:
          - _type: UserWorkingHours
            id: 2
            validFrom: '2025-01-01'
            mondayHours: 6.0
            tuesdayHours: 6.0
            wednesdayHours: 6.0
            thursdayHours: 6.0
            fridayHours: 6.0
            saturdayHours: 0.0
            sundayHours: 0.0
            availabilityFactor: 80
            _links:
              self:
                href: /api/v3/users/42/working_hours/2
              user:
                href: /api/v3/users/42
                title: Jane Doe
          - _type: UserWorkingHours
            id: 1
            validFrom: '2024-01-01'
            mondayHours: 8.0
            tuesdayHours: 8.0
            wednesdayHours: 8.0
            thursdayHours: 8.0
            fridayHours: 8.0
            saturdayHours: 0.0
            sundayHours: 0.0
            availabilityFactor: 100
            _links:
