  /api/v3/users/{id}/working_hours:
    get:
      summary: List working hours for a user
      operationId: list_user_working_hours
      tags:
      - User Working Times
      description: 'Returns all working hours records for the given user, ordered by `validFrom` descending.


        Multiple records may exist for a user; each represents a period of their working time

        configuration. The most recently effective record (the one with the latest `validFrom`

        that is not in the future) is used for capacity calculations.


        **Required permissions:**

        - Administrators can view working hours for any user.

        - Users with the global `manage_working_times` permission can view working hours for any user.

        - Any user can view their own working hours records.


        Use `me` as the `id` to reference the current user.'
      parameters:
      - name: id
        in: path
        required: true
        description: User id. Use `me` to reference the current user.
        schema:
          type: string
        example: 42
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserWorkingHoursCollectionModel'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
          description: Returned if the client is not authenticated.
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified user does not exist or you do not have permission to view them.
          description: Returned if the user does not exist or is not visible to the requesting user.
    post:
      summary: Create a working hours record for a user
      operationId: create_user_working_hours
      tags:
      - User Working Times
      description: 'Creates a new working hours record for the given user, effective from the given date.


        **Required permissions:**

        - Administrators can create working hours records for any user.

        - Users with the global `manage_own_working_times` permission can create records for themselves.

        - Users with the global `manage_working_times` permission can create working hours records for any user.


        Use `me` as the `id` to reference the current user.'
      parameters:
      - name: id
        in: path
        required: true
        description: User id. Use `me` to reference the current user.
        schema:
          type: string
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWorkingHoursModel'
            example:
              validFrom: '2025-01-01'
              mondayHours: 8
              tuesdayHours: 8
              wednesdayHours: 8
              thursdayHours: 8
              fridayHours: 8
              saturdayHours: 0
              sundayHours: 0
              availabilityFactor: 100
      responses:
        '201':
          description: Created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserWorkingHoursModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
          description: Returned if the client is not authenticated.
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** `manage_working_times` globally (for other users) or

            `manage_own_working_times` globally (for own records).'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified user does not exist or you do not have permission to view them.
          description: Returned if the user does not exist or is not visible to the requesting user.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Validation failed.
          description: Returned if the request body contains invalid parameters.
  /api/v3/users/{id}/working_hours/{working_hours_id}:
    get:
      summary: View a working hours record
      operationId: view_user_working_hours_record
      tags:
      - User Working Times
      description: 'Returns a single working hours record for the given user.


        **Required permissions:**

        - Administrators can view working hours records for any user.

        - Users with the global `manage_working_times` permission can view working hours for any user.

        - Any user can view their own working hours records.'
      parameters:
      - name: id
        in: path
        required: true
        description: User id.
        schema:
          type: integer
        example: 42
      - name: working_hours_id
        in: path
        required: true
        description: Working hours record id.
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserWorkingHoursModel'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
          description: Returned if the client is not authenticated.
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
          description: 'Returned if the user or working hours record does not exist,

            or if the requesting user does not have permission to view it.'
    patch:
      summary: Update a working hours record
      operationId: update_user_working_hours_record
      tags:
      - User Working Times
      description: 'Updates the given working hours record.


        Only records that have not yet taken effect (i.e., `validFrom` is in the future) can be

        updated. Attempting to update a record that is already in effect will return a `422` error.


        **Required permissions:**

        - Administrators can update working hours records for any user.

        - Users with the global `manage_own_working_times` permission can update their own records.

        - Users with the global `manage_working_times` permission can update working hours for any user.'
      parameters:
      - name: id
        in: path
        required: true
        description: User id.
        schema:
          type: integer
        example: 42
      - name: working_hours_id
        in: path
        required: true
        description: Working hours record id.
        schema:
          type: integer
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWorkingHoursModel'
            example:
              mondayHours: 6
              tuesdayHours: 6
              wednesdayHours: 6
              thursdayHours: 6
              fridayHours: 6
              saturdayHours: 0
              sundayHours: 0
              availabilityFactor: 80
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/UserWorkingHoursModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
          description: Returned if the client is not authenticated.
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** `manage_working_times` globally (for other users) or

            `manage_own_working_times` globally (for own records).'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
          description: 'Returned if the user or working hours record does not exist,

            or if the requesting user does not have permission to view it.'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: Validation failed.
          description: 'Returned if the request body contains invalid parameters, or if the record has

            already taken effect and cannot be modified.'
    delete:
      summary: Delete a working hours record
      operationId: delete_user_working_hours_record
      tags:
      - User Working Times
      description: 'Deletes the given working hours record.


        **Required permissions:**

        - Administrators can delete working hours records for any user.

        - Users with the global `manage_own_working_times` permission can delete their own records.

        - Users with the global `manage_working_times` permission can delete working hours records for any user.'
      parameters:
      - name: id
        in: path
        required: true
        description: User id.
        schema:
          type: integer
        example: 42
      - name: working_hours_id
        in: path
        required: true
        description: Working hours record id.
        schema:
          type: integer
        example: 2
      responses:
        '204':
          description: 'No Content.

            The record was deleted successfully.'
        '401':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:Unauthenticated
                message: You need to be authenticated to access this resource.
          description: Returned if the client is not authenticated.
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not authorized to access this resource.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** `manage_working_times` globally (for other users) or

            `manage_own_working_times` globally (for own records).'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The requested resource could not be found.
          description: 'Returned if the user or working hours record does not exist,

            or if the requesting user does not have permission to view it.'
components:
  schemas:
    CollectionLinks:
      type: object
      required:
      - self
      properties:
        self:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: 'This collection resource.


              **Resource**: Collection'
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type:
          - string
          - 'null'
          description: URL to the referenced resource (might be relative)
        title:
          type: string
          description: Representative label for the resource
        templated:
          type: boolean
          default: false
          description: If true the href contains parts that need to be replaced by the client
        method:
          type: string
          default: GET
          description: The HTTP verb to use when requesting the resource
        payload:
          type: object
          description: The payload to send in the request to achieve the desired result
        identifier:
          type: string
          description: An optional unique identifier to the link object
        type:
          type: string
          description: The MIME-Type of the returned resource.
      example:
        href: /api/v3/work_packages
        method: POST
    CollectionModel:
      type: object
      required:
      - _type
      - total
      - count
      - _links
      properties:
        _type:
          type: string
          enum:
          - Collection
        total:
          type: integer
          description: The total amount of elements available in the collection.
          minimum: 0
        count:
          type: integer
          description: Actual amount of elements in this response.
          minimum: 0
        _links:
          $ref: '#/components/schemas/CollectionLinks'
    UserNonWorkingTimeModel:
      type: object
      required:
      - _type
      - id
      - startDate
