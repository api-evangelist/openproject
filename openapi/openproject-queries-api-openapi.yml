    get:
      summary: View query
      operationId: View_query
      tags:
      - Queries
      description: Retrieve an individual query as identified by the id parameter. Then endpoint accepts a number of parameters that can be used to override the resources' persisted parameters.
      parameters:
      - name: id
        description: Query id
        example: '1'
        in: path
        required: true
        schema:
          type: integer
      - name: filters
        description: 'JSON specifying filter conditions.

          The filters provided as parameters are not applied to the query but are instead used to override the query''s persisted filters.

          All filters also accepted by the work packages endpoint are accepted. If no filter is to be applied, the client should send an empty array (`[]`).'
        example: '[{ "assignee": { "operator": "=", "values": ["1", "5"] }" }]'
        in: query
        required: false
        schema:
          default: '[{ "status_id": { "operator": "o", "values": null }}]'
          type: string
      - name: offset
        description: Page number inside the queries' result collection of work packages.
        example: '25'
        in: query
        required: false
        schema:
          default: 1
          type: integer
      - name: pageSize
        description: Number of elements to display per page for the queries' result collection of work packages.
        example: '25'
        in: query
        required: false
        schema:
          type: integer
      - name: columns
        description: Selected columns for the table view.
        example: '[]'
        in: query
        required: false
        schema:
          default: '[''type'', ''priority'']'
          type: string
      - name: sortBy
        description: JSON specifying sort criteria. The sort criteria is applied to the query's result collection of work packages overriding the query's persisted sort criteria.
        example: '[["status", "asc"]]'
        in: query
        required: false
        schema:
          default: '[["id", "asc"]]'
          type: string
      - name: groupBy
        description: The column to group by. The grouping criteria is applied to the to the query's result collection of work packages overriding the query's persisted group criteria.
        example: status
        in: query
        required: false
        schema:
          type: string
      - name: showSums
        description: Indicates whether properties should be summed up if they support it. The showSums parameter is applied to the to the query's result collection of work packages overriding the query's persisted sums property.
        example: true
        in: query
        required: false
        schema:
          default: false
          type: boolean
      - name: timestamps
        description: 'Indicates the timestamps to filter by when showing changed attributes on work packages. Values can be either ISO8601 dates, ISO8601 durations and the following relative date keywords: "oneDayAgo@HH:MM+HH:MM", "lastWorkingDay@HH:MM+HH:MM", "oneWeekAgo@HH:MM+HH:MM", "oneMonthAgo@HH:MM+HH:MM". The first "HH:MM" part represents the zero paded hours and minutes. The last "+HH:MM" part represents the timezone offset from UTC associated with the time, the offset can be positive or negative e.g."oneDayAgo@01:00+01:00", "oneDayAgo@01:00-01:00". Values older than 1 day are accepted only with valid Enterprise Token available.

          '
        example: 2023-01-01,P-1Y,PT0S,lastWorkingDay@12:00
        in: query
        required: false
        schema:
          default: PT0S
          type: string
      - name: timelineVisible
        description: Indicates whether the timeline should be shown.
        example: true
        in: query
        required: false
        schema:
          default: false
          type: boolean
      - name: timelineLabels
        description: Overridden labels in the timeline view
        example: '{}'
        in: query
        required: false
        schema:
          default: '{}'
          type: string
      - name: highlightingMode
        description: Highlighting mode for the table view.
        example: inline
        in: query
        required: false
        schema:
          default: inline
          type: string
      - name: highlightedAttributes
        description: Highlighted attributes mode for the table view when `highlightingMode` is `inline`. When set to `[]` all highlightable attributes will be returned as `highlightedAttributes`.
        example: '[]'
        in: query
        required: false
        schema:
          default: '[''type'', ''priority'']'
          type: string
      - name: showHierarchies
        description: Indicates whether the hierarchy mode should be enabled.
        example: true
        in: query
        required: false
        schema:
          default: true
          type: boolean
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                Query:
                  $ref: '#/components/examples/QueryModel'
              schema:
                $ref: '#/components/schemas/QueryModel'
          description: OK
          headers: {}
        '404':
