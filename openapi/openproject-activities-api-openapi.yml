openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Activities API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- description: '## Local Properties


    | Property | Description | Type | Constraints | Supported operations |

    | :---------: | ------------- | ---- | ----------- | -------------------- |

    | id | Activity id | Integer | x > 0 | READ |

    | version | Activity version | Integer | x > 0 | READ |

    | comment | | Formattable | | READ / WRITE |

    | details | | Array of Formattable | | READ |

    | createdAt | Time of creation | DateTime | | READ |

    | updatedAt | Time of update | DateTime | | READ |


    Activity can be either _type…'
  name: Activities
paths:
  /api/v3/activities/{id}:
    get:
      summary: Get an activity
      operationId: get_activity
      tags:
      - Activities
      description: Returns the requested activity resource identified by its unique id.
      parameters:
      - name: id
        description: Activity id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ActivityModel'
              examples:
                response:
                  $ref: '#/components/examples/ActivityResponse'
    patch:
      summary: Update activity
      operationId: update_activity
      tags:
      - Activities
      description: Updates an activity's comment and, on success, returns the updated activity.
      parameters:
      - name: id
        description: Activity id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCommentWriteModel'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ActivityModel'
              examples:
                response:
                  $ref: '#/components/examples/ActivityResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** edit journals'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to edit the comment of this journal entry.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Returned if the client tries to modify a read-only property.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyIsReadOnly
                    message: The ID of an activity can't be changed.
  /api/v3/activities/{id}/attachments:
    get:
      summary: List attachments by activity
      operationId: list_activity_attachments
      tags:
      - Activities
      description: List all attachments of a single activity.
      parameters:
      - name: id
        description: ID of the activity whose attachments will be listed
        in: path
        required: true
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Attachments_Model'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: "Returned if the activity does not exist or the client does not have sufficient permissions\nto see it.\n\n**Required permission:** \n- `view_work_packages`\n- for internal comments: `view_internal_comments`\n\n*Note: A client without sufficient permissions shall not be able to test for the existence of an activity.\nThat's why a 404 is returned here, even if a 403 might be more appropriate.*"
    post:
      summary: Add attachment to activity
      operationId: create_activity_attachment
      tags:
      - Activities
      description: Adds an attachment to the specified activity.
      parameters:
      - name: id
        description: ID of the activity to receive the attachment
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadForm'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AttachmentModel'
        '400':
          description: 'Returned if the client sends a not understandable request. Reasons include:


            * Omitting one of the required parts (metadata and file)


            * sending unparsable JSON in the metadata part'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:InvalidRequestBody
                    message: The request could not be parsed as JSON.
        '403':
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** view_work_packages or view_internal_comments (for internal comments)


            *Note that you will only receive this error, if you are at least allowed to see the activity*'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to add attachments to this activity.
        '404':
          description: 'Returned if the activity does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:** view_work_packages or view_internal_comments (for internal comments)


            *Note: A client without sufficient permissions shall not be able to test for the existence of an activity.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 'Returned if the client tries to send an invalid attachment.

            Reasons are:


            * Omitting the file name (`fileName` property of metadata part)


            * Sending a file that is too large'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                    message: File is too large (maximum size is 5242880 Bytes).
  /api/v3/activities/{id}/emoji_reactions:
    get:
      summary: List emoji reactions by activity
      operationId: list_activity_emoji_reactions
      tags:
      - Activities
      description: List all emoji reactions of a single activity.
      parameters:
      - name: id
        description: ID of the activity whose emoji reactions will be listed
        in: path
        required: true
        schema:
          type: integer
        example: '1'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EmojiReactions_Model'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: 'Returned if the activity does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:**

            - `view_work_packages`

            - for internal comments: `view_internal_comments`


            *Note: A client without sufficient permissions shall not be able to test for the existence of an activity.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
    patch:
      summary: Toggle emoji reaction for an activity
      operationId: toggle_activity_emoji_reaction
      tags:
      - Activities
      description: 'Toggle an emoji reaction for a given activity. If the user has already reacted with the given emoji,

        the reaction will be removed. Otherwise, a new reaction will be created.


        **Note:** The response contains the complete collection of all emoji reactions for this activity.


        **Required permission:**

        - `add_work_package_comments`

        - for internal comments: `add_internal_comments`'
      parameters:
      - name: id
        description: ID of the activity to toggle emoji reaction for
        in: path
        required: true
        schema:
          type: integer
        example: '1'
      requestBody:
        required: true
        content:
          application/hal+json:
            schema:
              type: object
              required:
              - reaction
              properties:
                reaction:
                  type: string
                  description: The emoji reaction identifier
                  example: thumbs_up
                  enum:
                  - thumbs_up
                  - thumbs_down
                  - grinning_face_with_smiling_eyes
                  - confused_face
                  - heart
                  - party_popper
                  - rocket
                  - eyes
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EmojiReactionModel'
        '400':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:BadRequest
                    message: 'Bad request: reaction does not have a valid value'
          description: Returned if the request is invalid. For example, if the reaction is not valid.
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not authorized to access this resource.
          description: Returned if the client does not have sufficient permissions to toggle the emoji reaction for the activity.
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: 'Returned if the activity does not exist or the client does not have sufficient permissions

            to see it.'
  /api/v3/work_packages/{id}/activities_emoji_reactions:
    get:
      summary: List emoji reactions by work package activities
      operationId: list_work_package_activities_emoji_reactions
      tags:
      - Activities
      description: List all emoji reactions of all activities of a single work package.
      parameters:
      - name: id
        description: ID of the work package whose activities' emoji reactions will be listed
        in: path
        required: true
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/EmojiReactions_Model'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The requested resource could not be found.
          description: 'Returned if the work package does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:**

            - `view_work_packages`

            - for internal comments: `view_internal_comments`


            *Note: A client without sufficient permissions shall not be able to test for the existence of a work package.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
components:
  schemas:
    EmojiReactions_Model:
      type: object
      properties:
        _type:
          type: string
          enum:
          - Collection
        total:
          type: integer
          description: Total number of emoji reactions
          minimum: 0
        count:
          type: integer
          description: Number of emoji reactions in this response
          minimum: 0
        _embedded:
          type: object
          properties:
            elements:
              type: array
              items:
                $ref: '#/components/schemas/EmojiReactionModel'
        _links:
          type: object
          properties:
            self:
              allOf:
              - $ref: '#/components/schemas/Link'
              - description: This collection
      example:
        _type: Collection
        total: 2
        count: 2
        _embedded:
          elements:
          - _type: EmojiReaction
            id: 1-thumbs_up
            reaction: thumbs_up
            emoji: 👍
            reactionsCount: 3
            firstReactionAt: '2024-04-08T15:37:19.275Z'
            _links:
              self:
                href: /api/v3/emoji_reactions/1-thumbs_up
              reactable:
                href: /api/v3/activities/1
              reactingUsers:
              - href: /api/v3/users/435
                title: John Doe
              - href: /api/v3/users/436
                title: Jane Smith
              - href: /api/v3/users/437
                title: Bob Johnson
          - _type: EmojiReaction
            id: 1-heart
            reaction: heart
            emoji: ❤️
            reactionsCount: 1
            firstReactionAt: '2024-04-08T15:38:19.275Z'
            _links:
              self:
                href: /api/v3/emoji_reactions/1-heart
              reactable:
                href: /api/v3/activities/1
              reactingUsers:
              - href: /api/v3/users/435
                title: John Doe
        _links:
          self:
            href: /api/v3/activities/1/emoji_reactions
    CollectionLinks:
      type: object
      required:
      - self
      properties:
        self:
          allOf:
          - $ref: '#/components/schemas/Link'
          - description: 'This collection resource.


              **Resource**: Collection'
    Link:
      type: object
      required:
      - href
      properties:
        href:
          type:
          - string
          - 'null'
          description: URL to the referenced resource (might be relative)
        title:
          type: string
          description: Representative label for the resource
        templated:
          type: boolean
          default: false
          description: If true the href contains parts that need to be replaced by the client
        method:
          type: string
          default: GET
          description: The HTTP verb to use when requesting the resource
        payload:
          type: object
          description: The payload to send in the request to achieve the desired result
        identifier:
          type: string
          description: An optional unique identifier to the link object
        type:
          type: string
          description: The MIME-Type of the returned resource.
      example:
        href: /api/v3/work_packages
        method: POST
    WorkPackageModel:
      allOf:
      - $ref: '#/components/schemas/CustomFieldProperties'
      - type: object
        required:
        - subject
        - _links
        properties:
          id:
            type: integer
            description: Work package id
            readOnly: true
            minimum: 1
          lockVersion:
            type: integer
            description: The version of the item as used for optimistic locking
            readOnly: true
          subject:
            type: string
            description: Work package subject
          _type:
            type: string
            enum:
            - WorkPackage
            readOnly: true
          description:
            allOf:
            - $ref: '#/components/schemas/Formattable'
            - description: The work package description
          scheduleManually:
            type: boolean
            description: 'Uses manual scheduling mode when true (default). Uses automatic scheduling

              mode when false. Can be automatic only when predecessors or children are

              present.'
          readonly:
            type: boolean
            description: If true, the work package is in a readonly status so with the exception of the status, no other property can be altered.
          startDate:
            type:
            - string
            - 'null'
            format: date
            description: Scheduled beginning of a work package
          dueDate:
            type:
            - string
            - 'null'
            format: date
            description: Scheduled end of a work package
          date:
            type:
            - string
            - 'null'
            format: date
            description: Date on which a milestone is achieved
          derivedStartDate:
            type:
            - string
            - 'null'
            format: date
            description: Similar to start date but is not set by a client but rather deduced by the work packages' descendants. If manual scheduleManually is active, the two dates can deviate.
            readOnly: true
          derivedDueDate:
            type:
            - string
            - 'null'
            format: date
            description: Similar to due date but is not set by a client but rather deduced by the work packages' descendants. If manual scheduleManually is active, the two dates can deviate.
            readOnly: true
          duration:
            type:
            - string
            - 'null'
            format: duration
            description: '**(NOT IMPLEMENTED)** The amount of time in hours the work package needs to be completed.

              Not available for milestone type of work packages.'
            readOnly: true
          estimatedTime:
            type:
            - string
            - 'null'
            format: duration
            description: Time a work package likely needs to be completed excluding its descendants
          derivedEstimatedTime:
            type:
            - string
            - 'null'
            format: duration
            description: Time a work package likely needs to be completed including its descendants
            readOnly: true
          ignoreNonWorkingDays:
            type: boolean
            description: '**(NOT IMPLEMENTED)** When scheduling, whether or not to ignore the non working days being defined.

              A work package with the flag set to true will be allowed to be scheduled to a non working day.'
            readOnly: true
          position:
            type:
            - integer
            - 'null'
            description: 'The position this work package has in a version configured to be backlog (sprint or product).


              # Conditions


              **Permission** Backlogs needs to be enabled in the work package''s project and the work package''s type is configured to be a backlog type.'
            readOnly: true
          spentTime:
            type: string
            format: duration
            description: 'The time booked for this work package by users working on it


              # Conditions


              **Permission** view time entries'
            readOnly: true
          storyPoints:
            type:
            - integer
            - 'null'
            description: 'The estimation in story points on how long this work package will take to complete


              # Conditions


              **Permission** Backlogs needs to be enabled in the work package''s project and the work package''s type is configured to be a backlog type.'
            readOnly: false
          percentageDone:
            type:
            - integer
            - 'null'
            description: Amount of total completion for a work package
            minimum: 0
            maximum: 100
          derivedPercentageDone:
            type:
            - integer
            - 'null'
            description: Amount of total completion for a work package derived from itself and its descendant work packages
            readOnly: true
            minimum: 0
            maximum: 100
          createdAt:
            type: string
            format: date-time
            description: Time of creation. Can be writable by admins with the `apiv3_write_readonly_attributes` setting enabled.
            readOnly: true
          updatedAt:
            type: string
            format: date-time
            description: Time of the most recent change to the work package.
            readOnly: true
          _links:
            type: object
            required:
            - self
            - schema
            - ancestors
            - author
            - priority
            - project
            - status
            - type
            properties:
              addComment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Post comment to WP


                    # Conditions


                    **Permission**: add work package notes'
                  readOnly: true
              addRelation:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Adds a relation to this work package.


                    # Conditions


                    **Permission**: manage wp relations'
                  readOnly: true
              addWatcher:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add any user to WP watchers


                    # Conditions


                    **Permission**: add watcher'
                  readOnly: true
              customActions:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A predefined action that can be applied to the work package.


                      **Resource**: CustomAction'
                    readOnly: true
              previewMarkup:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: Post markup (in markdown) here to receive an HTML-rendered response
                  readOnly: true
              removeWatcher:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Remove any user from WP watchers


                    # Conditions


                    **Permission**: delete watcher'
                  readOnly: true
              delete:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Delete this work package


                    # Conditions


                    **Permission**: delete_work_packages'
                  readOnly: true
              logTime:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Create time entries on the work package


                    # Conditions


                    **Permission**: log_time or log_own_time'
                  readOnly: true
              move:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Link to page for moving this work package


                    # Conditions


                    **Permission**: move_work_packages'
                  readOnly: true
              copy:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Link to page for copying this work package


                    # Conditions


                    **Permission**: add_work_packages'
                  readOnly: true
              unwatch:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Remove current user from WP watchers


                    # Conditions


                    logged in; watching'
                  readOnly: true
              update:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Form endpoint that aids in preparing and performing edits on a work package


                    # Conditions


                    **Permission**: edit work package'
                  readOnly: true
              updateImmediately:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Directly perform edits on a work package


                    # Conditions


                    **Permission**: edit work package'
                  readOnly: true
              watch:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add current user to WP watchers


                    # Conditions


                    logged in; not watching'
                  readOnly: true
              self:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'This work package


                    **Resource**: WorkPackage'
                  readOnly: true
              schema:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The schema of this work package


                    **Resource**: Schema'
                  readOnly: true
              ancestors:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A visible ancestor work package of the current work package.


                      **Resource**: WorkPackage


                      # Conditions


                      **Permission** view work packages'
                    readOnly: true
              attachments:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The files attached to this work package


                    **Resource**: Collection


                    # Conditions


                    - **Setting**: deactivate_work_package_attachments set to false in related workspace'
              addAttachment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Attach a file to the work package


                    # Conditions


                    - **Permission**: edit work package'
                  readOnly: true
              prepareAttachment:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Attach a file to the work package


                    # Conditions


                    - **Setting**: direct uploads enabled'
                  readOnly: true
              author:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The person that created the work package


                    **Resource**: User'
                  readOnly: true
              assignee:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The person that is intended to work on the work package


                    **Resource**: User'
              availableWatchers:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'All users that can be added to the work package as watchers.


                    **Resource**: User


                    # Conditions


                    **Permission** add work package watchers'
                  readOnly: true
              budget:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The budget this work package is associated to


                    **Resource**: Budget


                    # Conditions


                    **Permission** view cost objects'
              category:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The category of the work package


                    **Resource**: Category'
              children:
                type: array
                readOnly: true
                items:
                  allOf:
                  - $ref: '#/components/schemas/Link'
                  - description: 'A visible child work package of the current work package.


                      **Resource**: WorkPackage


                      # Conditions


                      **Permission** view work packages'
                    readOnly: true
              addFileLink:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Add a file link to the work package


                    # Conditions


                    **Permission**: manage_file_links'
              fileLinks:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Gets the file link collection of this work package


                    # Conditions


                    **Permission**: view_file_links'
              parent:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'Parent work package


                    **Resource**: WorkPackage'
              priority:
                allOf:
                - $ref: '#/components/schemas/Link'
                - description: 'The priority of the work package


                    **Resource**: Priority'
