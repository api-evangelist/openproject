openapi: 3.2.0
info:
  description: You're looking at the current **stable** documentation of the OpenProject APIv3.
  title: OpenProject API V3 (Stable) Work Packages API
  version: '3'
servers:
- url: https://qa.openproject-edge.com
  description: Edge QA instance
- url: https://qa.openproject-stage.com
  description: Staging instance
- url: https://community.openproject.org
  description: Community instance
security:
- BasicAuth: []
tags:
- description: The work packages endpoints return collections or single entities of type `WorkPackage`.
  name: Work Packages
paths:
  /api/v3/projects/{id}/work_packages:
    get:
      summary: Get work packages of project
      operationId: Get_Project_Work_Package_Collection
      tags:
      - Work Packages
      description: 'Returns the collection of work packages that are related to the given project.

        This endpoint is deprecated and replaced by `/api/v3/workspaces/{id}/work_packages`'
      parameters:
      - description: Project id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Page number inside the requested collection.
        example: 25
        in: query
        name: offset
        required: false
        schema:
          default: 1
          type: integer
      - description: Number of elements to display per page.
        example: 25
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint. If no filter is to be applied, the client should send an empty array (`[]`).'
        example: '[{ "type_id": { "operator": "=", "values": [''1'', ''2''] }}]'
        in: query
        name: filters
        required: false
        schema:
          default: '[{ "status_id": { "operator": "o", "values": null }}]'
          type: string
      - description: 'JSON specifying sort criteria.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.'
        example: '[["status", "asc"]]'
        in: query
        name: sortBy
        required: false
        schema:
          default: '[["id", "asc"]]'
          type: string
      - description: The column to group by.
        example: status
        in: query
        name: groupBy
        required: false
        schema:
          type: string
      - description: Indicates whether properties should be summed up if they support it.
        example: true
        in: query
        name: showSums
        required: false
        schema:
          default: false
          type: boolean
      - description: Comma separated list of properties to include.
        example: total,elements/subject,elements/id,self
        in: query
        name: select
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Work_PackagesModel'
          description: OK
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to see the work packages of this project.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** view work packages


            *Note that you will only receive this error, if you are at least allowed to see the corresponding project.*'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified project does not exist.
          description: 'Returned if the project does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view project'
    post:
      summary: Create work package in project
      operationId: Create_Project_Work_Package
      tags:
      - Work Packages
      description: 'When calling this endpoint the client provides a single object, containing at least the properties and links that

        are required, in the body. The required fields of a WorkPackage can be found in its schema, which is embedded in

        the respective form. Note that it is only allowed to provide properties or links supporting the write operation.


        This endpoint is deprecated and replaced by `/api/v3/workspaces/{id}/work_packages`'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPackageModel'
      parameters:
      - description: Project id
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: 'Indicates whether change notifications (e.g. via E-Mail) should be sent.

          Note that this controls notifications for all users interested in changes to the work package (e.g. watchers, author and assignee),

          not just the current user.'
        example: false
        in: query
        name: notify
        required: false
        schema:
          default: true
          type: boolean
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/WorkPackageModel'
          description: OK
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to add work packages to this project.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** add work packages


            *Note that you will only receive this error, if you are at least allowed to see the corresponding project.*'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified project does not exist.
          description: 'Returned if the project does not exist or the client does not have sufficient permissions

            to see it.


            **Required permissions:** view project


            *Note: A client without sufficient permissions shall not be able to test for the existence of a project.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _embedded:
                  details:
                    attribute: Subject
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: The subject might not be blank.
          description: 'Returned if:


            * the client tries to write a read-only property


            * a constraint for a property was violated


            * a property was provided in an unreadable format'
  /api/v3/projects/{id}/work_packages/form:
    post:
      summary: Form for creating Work Packages in a Project
      operationId: form_create_work_package_in_project
      tags:
      - Work Packages
      description: 'This endpoint allows you to validation a new work package creation body in a specific project. It works similarly

        to the `/api/v3/work_packages/form` endpoint, but already specifies the work package''s project in the path, so that

        it does not have to be defined in the request body.


        This endpoint is deprecated and replaced by `/api/v3/workspaces/{id}/work_packages/form`'
      parameters:
      - name: id
        description: ID of the project in which the work package will be created
        in: path
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPackageWriteModel'
            examples:
              Minimal example:
                $ref: '#/components/examples/WorkPackageCreateOnlySubject'
              Valid example:
                $ref: '#/components/examples/WorkPackageCreateValid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageFormModel'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v3/projects/{id}/available_assignees:
    get:
      parameters:
      - description: Project id
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _embedded:
                      elements:
                      - _links:
                          delete:
                            href: /api/v3/users/1
                            method: DELETE
                            title: Delete j.sheppard
                          lock:
                            href: /api/v3/users/1/lock
                            method: POST
                            title: Set lock on j.sheppard
                          self:
                            href: /api/v3/users/1
                            title: John Sheppard - j.sheppard
                        _type: User
                        avatar: https://example.org/users/1/avatar
                        createdAt: '2014-05-21T08:51:20.396Z'
                        email: shep@mail.com
                        firstName: John
                        id: 1
                        lastName: Sheppard
                        login: j.sheppard
                        status: active
                        updatedAt: '2014-05-21T08:51:20.396Z'
                      - _links:
                          delete:
                            href: /api/v3/users/2
                            method: DELETE
                            title: Delete j.sheppard2
                          lock:
                            href: /api/v3/users/2/lock
                            method: POST
                            title: Set lock on j.sheppard2
                          self:
                            href: /api/v3/users/2
                            title: Jim Sheppard - j.sheppard2
                        _type: User
                        avatar: https://example.org/users/1/avatar
                        createdAt: '2014-05-21T08:51:20.396Z'
                        email: shep@mail.net
                        firstName: Jim
                        id: 2
                        lastName: Sheppard
                        login: j.sheppard2
                        status: active
                        updatedAt: '2014-05-21T08:51:20.396Z'
                    _links:
                      self:
                        href: /api/v3/projects/42/available_assignees
                    _type: Collection
                    count: 2
                    total: 2
              schema:
                $ref: '#/components/schemas/Available_AssigneesModel'
          description: OK
          headers: {}
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to see the assignable users for this project.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** add work packages


            *Note that you will only receive this error, if you are at least allowed to see the corresponding project.*'
          headers: {}
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified project does not exist.
          description: 'Returned if the project does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view project'
          headers: {}
      tags:
      - Work Packages
      description: 'Gets a list of users that can be assigned to work packages in the given project.

        This endpoint is deprecated and replaced by `/api/v3/workspaces/{id}/available_assignees`'
      operationId: Project_Available_assignees
      summary: Project Available assignees
  /api/v3/work_packages:
    get:
      summary: List work packages
      operationId: list_work_packages
      tags:
      - Work Packages
      description: Returns a collection of work packages.
      parameters:
      - description: Page number inside the requested collection.
        example: '25'
        in: query
        name: offset
        required: false
        schema:
          default: 1
          type: integer
      - description: Number of elements to display per page.
        example: '25'
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
      - description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/)

          endpoint. If no filter is to be applied, the client should send an empty array (`[]`), otherwise a default

          filter is applied. A Currently supported filters are (there are additional filters added by modules):


          - assigned_to

          - assignee_or_group

          - attachment_base

          - attachment_content

          - attachment_file_name

          - author

          - blocked

          - blocks

          - category

          - comment

          - created_at

          - custom_field

          - dates_interval

          - description

          - done_ratio

          - due_date

          - duplicated

          - duplicates

          - duration

          - estimated_hours

          - file_link_origin_id

          - follows

          - group

          - id

          - includes

          - linkable_to_storage_id

          - linkable_to_storage_url

          - manual_sort

          - milestone

          - only_subproject

          - parent

          - partof

          - precedes

          - principal_base

          - priority

          - project

          - relatable

          - relates

          - required

          - requires

          - responsible

          - role

          - search

          - start_date

          - status

          - storage_id

          - storage_url

          - subject

          - subject_or_id

          - subproject

          - type

          - typeahead

          - updated_at

          - version

          - watcher

          - work_package'
        example: '[{ "type_id": { "operator": "=", "values": ["1", "2"] }}]'
        in: query
        name: filters
        required: false
        schema:
          default: '[{ "status_id": { "operator": "o", "values": null }}]'
          type: string
      - description: 'JSON specifying sort criteria.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/) endpoint.'
        example: '[["status", "asc"]]'
        in: query
        name: sortBy
        required: false
        schema:
          default: '[["id", "asc"]]'
          type: string
      - description: The column to group by.
        example: status
        in: query
        name: groupBy
        required: false
        schema:
          type: string
      - description: Indicates whether properties should be summed up if they support it.
        example: true
        in: query
        name: showSums
        required: false
        schema:
          default: false
          type: boolean
      - description: Comma separated list of properties to include.
        example: total,elements/subject,elements/id,self
        in: query
        name: select
        required: false
        schema:
          type: string
      - description: 'In order to perform a [baseline comparison](/docs/api/baseline-comparisons), you may provide one or several timestamps

          in ISO-8601 format as comma-separated list. The timestamps may be absolute or relative,

          such as ISO8601 dates, ISO8601 durations and the following relative date keywords: "oneDayAgo@HH:MM+HH:MM",

          "lastWorkingDay@HH:MM+HH:MM", "oneWeekAgo@HH:MM+HH:MM", "oneMonthAgo@HH:MM+HH:MM".

          The first "HH:MM" part represents the zero paded hours and minutes.

          The last "+HH:MM" part represents the timezone offset from UTC associated with the time,

          the offset can be positive or negative e.g."oneDayAgo@01:00+01:00", "oneDayAgo@01:00-01:00".


          Usually, the first timestamp is the baseline date, the last timestamp is the current date.

          Values older than 1 day are accepted only with valid Enterprise Token available.'
        example: 2022-01-01T00:00:00Z,PT0S
        in: query
        name: timestamps
        required: false
        schema:
          default: PT0S
          type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Work_PackagesModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to see work packages.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** view work packages (globally or in any project)'
    post:
      summary: Create Work Package
      operationId: create_work_package
      tags:
      - Work Packages
      description: 'When calling this endpoint the client provides a single object, containing at least the properties and links that are required, in the body.

        The required fields of a WorkPackage can be found in its schema, which is embedded in the respective form.

        Note that it is only allowed to provide properties or links supporting the write operation.


        A project link must be set when creating work packages through this route.


        When setting start date, finish date, and duration together, their correctness will be checked and a 422 error will be returned if one value does not match with the two others. You can make the server compute a value: set only two values in the request and the third one will be computed and returned in the response. For instance, when sending `{ "startDate": "2022-08-23", duration: "P2D" }`, the response will include `{ "dueDate": "2022-08-24" }`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPackageModel'
      parameters:
      - description: 'Indicates whether change notifications (e.g. via E-Mail) should be sent.

          Note that this controls notifications for all users interested in changes to the work package (e.g. watchers, author and assignee),

          not just the current user.'
        example: false
        in: query
        name: notify
        required: false
        schema:
          default: true
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/WorkPackageModel'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to add work packages to this project.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** add work packages


            *Note that you will only receive this error, if you are at least allowed to see the corresponding project.*'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified project does not exist.
          description: 'Returned if the project does not exist or the client does not have sufficient permissions

            to see it.


            **Required permissions:** view project


            *Note: A client without sufficient permissions shall not be able to test for the existence of a project.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:PropertyConstraintViolation
                message: The subject might not be blank.
                _embedded:
                  details:
                    attribute: Subject
          description: 'Returned if:


            * the client tries to write a read-only property


            * a constraint for a property was violated


            * a property was provided in an unreadable format'
  /api/v3/work_packages/form:
    post:
      summary: Form for creating a Work Package
      operationId: form_create_work_package
      tags:
      - Work Packages
      description: 'When calling this endpoint, the client provides a single object containing the properties and links to be

        created, in the body. The input is validated and a schema response is returned. If the validation errors of the

        response is empty, the same payload can be used to create a work package.


        Only the properties of the work package write model are allowed to set on a work package on creation.


        When setting start date, finish date, and duration together, their correctness will be checked and a validation

        error will be returned if one value does not match with the two others. You can make the server compute a value:

        set only two values in the request and the third one will be computed and returned in the response. For instance,

        when sending `{ "startDate": "2022-08-23", duration: "P2D" }`, the response will

        include `{ "dueDate": "2022-08-24" }`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPackageWriteModel'
            examples:
              Valid creation:
                $ref: '#/components/examples/WorkPackageCreateValid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPackageFormModel'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v3/work_packages/schemas:
    get:
      summary: List Work Package Schemas
      operationId: list_work_package_schemas
      tags:
      - Work Packages
      description: 'List all work package schemas that match the given filters. This endpoint does not return a successful response,

        if no filter is given.'
      parameters:
      - name: filters
        description: 'JSON specifying filter conditions.

          Accepts the same format as returned by the [queries](https://www.openproject.org/docs/api/endpoints/queries/)

          endpoint. Currently supported filters are:


          + id: The schema''s id


          Schema id has the form `project_id-work_package_type_id`.'
        in: query
        required: true
        schema:
          type: string
        example: '[{ "id": { "operator": "=", "values": ["12-1", "14-2"] } }]'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              examples:
                response:
                  value:
                    _embedded:
                      elements:
                      - _links:
                          self:
                            href: /api/v3/work_packages/schemas/13-1
                        _type: Schema...
                      - _links:
                          self:
                            href: /api/v3/work_packages/schemas/7-6
                        _type: Schema...
                    _links:
                      self:
                        href: /api/v3/work_packages/schemas
                    _type: Collection
                    count: 2
                    total: 5
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                    message: You are not allowed to list schemas.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** View work packages in any project.'
          headers: {}
  /api/v3/work_packages/schemas/{identifier}:
    get:
      parameters:
      - description: Identifier of the schema
        example: 12-13
        in: path
        name: identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    _type: Error
                    errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                    message: The specified schema does not exist.
          description: 'Returned if the schema does not exist or the client does not have sufficient permissions

            to see it.


            **Required permission:** view work packages (on the project where this schema is used)


            *Note: A client without sufficient permissions shall not be able to test for the existence of a project.

            That''s why a 404 is returned here, even if a 403 might be more appropriate.*'
          headers: {}
      tags:
      - Work Packages
      description: ''
      operationId: View_Work_Package_Schema
      summary: View Work Package Schema
  /api/v3/work_packages/{id}:
    delete:
      summary: Delete Work Package
      operationId: delete_work_package
      tags:
      - Work Packages
      description: 'Deletes the work package, as well as:


        - all associated time entries

        - its hierarchy of child work packages'
      parameters:
      - description: Work package id
        in: path
        name: id
        required: true
        schema:
          type: integer
        example: 1
      responses:
        '204':
          description: 'Returned if the work package was deleted successfully.


            Note that the response body is empty as of now. In future versions of the API a body

            *might* be returned along with an appropriate HTTP status.'
        '403':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:MissingPermission
                message: You are not allowed to delete this work package.
          description: 'Returned if the client does not have sufficient permissions.


            **Required permission:** delete work package'
        '404':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                _type: Error
                errorIdentifier: urn:openproject-org:api:v3:errors:NotFound
                message: The specified work package does not exist.
          description: 'Returned if the work package does not exist or the client does not have sufficient permissions to see it.


            **Required permission:** view work package'
        '406':
          $ref: '#/components/responses/MissingContentType'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      summary: View Work Package
      operationId: view_work_package
      tags:
      - Work Packages
      description: Returns the specified work package.
      parameters:
      - description: Work package id
        in: path
        name: id
        required: true
        schema:
          type: integer
        example: 1
      - description: 'In order to perform a [baseline comparison](/docs/api/baseline-comparisons) of the work-package attributes, you may

          provide one or several timestamps in ISO-8601 format as comma-separated list. The timestamps may be absolute or relative,

          such as ISO8601 dates, ISO8601 durations and the following relative date keywords: "oneDayAgo@HH:MM+HH:MM",

          "lastWorkingDay@HH:MM+HH:MM", "oneWeekAgo@HH:MM+HH:MM", "oneMonthAgo@HH:MM+HH:MM".

          The first "HH:MM" part represents the zero paded hours and minutes.

          The last "+HH:MM" part represents the timezone offset from UTC associated with the time,

          the offset can be positive or negative e.g."oneDayAgo@01:00+01:00", "oneDayAgo@01:00-01:00".


          Usually, the first timestamp is the baseline date, the last timestamp is the current date.

          Values older than 1 day are accepted only with valid Enterprise Token available.'
        in: query
        name: timestamps
        required: false
        schema:
          default: PT0S
          type: string
        example: 2022-01-01T00:00:00Z,PT0S
