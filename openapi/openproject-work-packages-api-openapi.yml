    post:
      summary: Create work package in workspace
      operationId: Create_Workspace_Work_Package
      tags:
      - Work Packages
      description: 'When calling this endpoint the client provides a single object, containing at least the properties and links that

        are required, in the body. The required fields of a WorkPackage can be found in its schema, which is embedded in

        the respective form. Note that it is only allowed to provide properties or links supporting the write operation.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkPackageModel'
      parameters:
      - description: Project id
        example: '1'
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: 'Indicates whether change notifications (e.g. via E-Mail) should be sent.

          Note that this controls notifications for all users interested in changes to the work package (e.g. watchers, author and assignee),

          not just the current user.'
        example: false
        in: query
        name: notify
        required: false
        schema:
          default: true
          type: boolean
